<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .font-black { font-family: 'Inter', 'Arial Black', sans-serif; font-weight: 900; }
      .font-bold { font-family: 'Inter', Arial, sans-serif; font-weight: 700; }
      .font-light { font-family: 'Inter', Arial, sans-serif; font-weight: 300; }
      .font-regular { font-family: 'Inter', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- ==================== SIDEBAR ==================== -->
  <rect width="260" height="900" fill="#1A1A2E"/>

  <!-- Logo -->
  <circle cx="42" cy="40" r="18" fill="none" stroke="#E8553D" stroke-width="2.5"/>
  <circle cx="42" cy="40" r="7" fill="#E8553D" opacity="0.4"/>
  <line x1="42" y1="22" x2="42" y2="58" stroke="#E8553D" stroke-width="1.5" opacity="0.5"/>
  <line x1="24" y1="40" x2="60" y2="40" stroke="#E8553D" stroke-width="1.5" opacity="0.5"/>
  <text x="70" y="37" class="font-bold" fill="#FFFFFF" font-size="13" letter-spacing="1">PLACE AUX</text>
  <text x="70" y="54" class="font-bold" fill="#E8553D" font-size="13" letter-spacing="1">COACHS</text>
  <line x1="20" y1="80" x2="240" y2="80" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>

  <!-- Nav - Entraînements active -->
  <rect x="0" y="100" width="260" height="52" fill="#FFFFFF" opacity="0.05"/>
  <rect x="0" y="100" width="5" height="52" fill="#E8553D"/>
  <text x="55" y="131" class="font-bold" fill="#FFFFFF" font-size="12" letter-spacing="2.5">ENTRAÎNEMENTS</text>
  <rect x="22" y="115" width="18" height="18" fill="none" stroke="#E8553D" stroke-width="1.5"/>

  <g opacity="0.5">
    <text x="55" y="183" class="font-bold" fill="#FFFFFF" font-size="12" letter-spacing="2.5">GROUPES</text>
    <rect x="22" y="167" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  <g opacity="0.5">
    <text x="55" y="235" class="font-bold" fill="#FFFFFF" font-size="12" letter-spacing="2.5">COMMUNAUTÉ</text>
    <circle cx="31" cy="228" r="9" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  <g opacity="0.5">
    <text x="55" y="287" class="font-bold" fill="#FFFFFF" font-size="12" letter-spacing="2.5">PROFIL</text>
    <circle cx="31" cy="280" r="9" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Decorative -->
  <polygon points="100,750 130,710 160,750" fill="none" stroke="#F2B705" stroke-width="0.5" opacity="0.1"/>
  <circle cx="130" cy="620" r="60" fill="none" stroke="#1A8A7D" stroke-width="0.5" opacity="0.08"/>

  <!-- ==================== HEADER CORAL STRIP ==================== -->
  <rect x="260" y="0" width="1180" height="90" fill="#E8553D"/>
  <!-- Breadcrumb -->
  <text x="310" y="35" class="font-regular" fill="#FFFFFF" font-size="12" opacity="0.7">Entraînements</text>
  <text x="400" y="35" class="font-regular" fill="#FFFFFF" font-size="12" opacity="0.5">/</text>
  <text x="415" y="35" class="font-bold" fill="#FFFFFF" font-size="12">Défense 1-5 repli</text>
  <!-- Title -->
  <text x="310" y="70" class="font-black" fill="#FFFFFF" font-size="30" letter-spacing="-0.5">DÉFENSE 1-5 REPLI</text>
  <!-- Geometric decoration -->
  <polygon points="1400,0 1440,0 1440,40" fill="#FFFFFF" opacity="0.1"/>
  <polygon points="1350,90 1440,90 1440,30" fill="#FFFFFF" opacity="0.05"/>

  <!-- ==================== METADATA BAR ==================== -->
  <rect x="260" y="90" width="1180" height="55" fill="#FFFFFF"/>
  <g transform="translate(310, 105)">
    <text x="0" y="20" class="font-bold" fill="#1A1A2E" font-size="11" letter-spacing="1">CATÉGORIE</text>
    <text x="0" y="36" class="font-regular" fill="#1A1A2E" font-size="13">U15</text>

    <rect x="100" y="0" width="2" height="40" fill="#1A1A2E" opacity="0.15"/>

    <text x="120" y="20" class="font-bold" fill="#1A1A2E" font-size="11" letter-spacing="1">DATE</text>
    <text x="120" y="36" class="font-regular" fill="#1A1A2E" font-size="13">12 mars 2026</text>

    <rect x="265" y="0" width="2" height="40" fill="#1A1A2E" opacity="0.15"/>

    <text x="285" y="20" class="font-bold" fill="#1A1A2E" font-size="11" letter-spacing="1">EFFECTIF</text>
    <text x="285" y="36" class="font-regular" fill="#1A1A2E" font-size="13">16 joueurs</text>

    <rect x="400" y="0" width="2" height="40" fill="#1A1A2E" opacity="0.15"/>

    <text x="420" y="20" class="font-bold" fill="#1A1A2E" font-size="11" letter-spacing="1">DURÉE</text>
    <text x="420" y="36" class="font-regular" fill="#1A1A2E" font-size="13">90 min</text>

    <rect x="520" y="0" width="2" height="40" fill="#1A1A2E" opacity="0.15"/>

    <text x="540" y="20" class="font-bold" fill="#1A1A2E" font-size="11" letter-spacing="1">STATUT</text>
    <text x="540" y="36" class="font-bold" fill="#E8553D" font-size="13">BROUILLON</text>

    <rect x="680" y="0" width="2" height="40" fill="#1A1A2E" opacity="0.15"/>

    <text x="700" y="20" class="font-bold" fill="#1A1A2E" font-size="11" letter-spacing="1">OBJECTIF</text>
    <text x="700" y="36" class="font-regular" fill="#1A1A2E" font-size="13">Améliorer le repli défensif</text>
  </g>

  <!-- ==================== LEFT PANEL - SITUATIONS LIST ==================== -->
  <rect x="260" y="145" width="300" height="695" fill="#FFFFFF"/>
  <rect x="260" y="145" width="300" height="695" fill="#FAF7F2" opacity="0.5"/>

  <!-- Section title -->
  <text x="290" y="180" class="font-bold" fill="#1A1A2E" font-size="14" letter-spacing="1.5">SITUATIONS</text>
  <rect x="290" y="188" width="40" height="3" fill="#E8553D"/>

  <!-- Situation 1 - Active -->
  <rect x="260" y="210" width="300" height="80" fill="#1A8A7D" opacity="0.08"/>
  <rect x="260" y="210" width="5" height="80" fill="#1A8A7D"/>
  <circle cx="290" cy="240" r="18" fill="#1A8A7D"/>
  <text x="290" y="246" class="font-black" fill="#FFFFFF" font-size="16" text-anchor="middle">1</text>
  <text x="320" y="237" class="font-bold" fill="#1A1A2E" font-size="14">Échauffement défensif</text>
  <text x="320" y="257" class="font-light" fill="#1A1A2E" font-size="11" opacity="0.6">2 schémas · 8 éléments</text>
  <text x="320" y="275" class="font-regular" fill="#1A8A7D" font-size="10" letter-spacing="0.5">SÉLECTIONNÉ</text>

  <!-- Situation 2 -->
  <rect x="260" y="300" width="5" height="80" fill="#E8553D" opacity="0.3"/>
  <circle cx="290" cy="330" r="18" fill="#FAF7F2" stroke="#1A1A2E" stroke-width="1.5"/>
  <text x="290" y="336" class="font-black" fill="#1A1A2E" font-size="16" text-anchor="middle">2</text>
  <text x="320" y="327" class="font-bold" fill="#1A1A2E" font-size="14">Repli 1-5 basique</text>
  <text x="320" y="347" class="font-light" fill="#1A1A2E" font-size="11" opacity="0.6">1 schéma · 12 éléments</text>

  <!-- Situation 3 -->
  <rect x="260" y="390" width="5" height="80" fill="#F2B705" opacity="0.3"/>
  <circle cx="290" cy="420" r="18" fill="#FAF7F2" stroke="#1A1A2E" stroke-width="1.5"/>
  <text x="290" y="426" class="font-black" fill="#1A1A2E" font-size="16" text-anchor="middle">3</text>
  <text x="320" y="417" class="font-bold" fill="#1A1A2E" font-size="14">Repli avec transition</text>
  <text x="320" y="437" class="font-light" fill="#1A1A2E" font-size="11" opacity="0.6">2 schémas · 15 éléments</text>

  <!-- Situation 4 -->
  <rect x="260" y="480" width="5" height="80" fill="#1A1A2E" opacity="0.15"/>
  <circle cx="290" cy="510" r="18" fill="#FAF7F2" stroke="#1A1A2E" stroke-width="1.5"/>
  <text x="290" y="516" class="font-black" fill="#1A1A2E" font-size="16" text-anchor="middle">4</text>
  <text x="320" y="507" class="font-bold" fill="#1A1A2E" font-size="14">Jeu à thème</text>
  <text x="320" y="527" class="font-light" fill="#1A1A2E" font-size="11" opacity="0.6">1 schéma · 10 éléments</text>

  <!-- Add situation button -->
  <g transform="translate(290, 590)">
    <rect x="0" y="0" width="240" height="44" fill="none" stroke="#1A1A2E" stroke-width="1.5" stroke-dasharray="6,4" rx="2"/>
    <text x="120" y="27" class="font-bold" fill="#1A1A2E" font-size="12" letter-spacing="1" text-anchor="middle" opacity="0.5">+ AJOUTER SITUATION</text>
  </g>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <rect x="560" y="145" width="880" height="695" fill="#FAF7F2"/>

  <!-- Situation Title -->
  <text x="600" y="195" class="font-black" fill="#1A1A2E" font-size="26" letter-spacing="-0.5">ÉCHAUFFEMENT DÉFENSIF</text>
  <rect x="600" y="205" width="50" height="3" fill="#1A8A7D"/>

  <!-- Schema tabs -->
  <g transform="translate(600, 225)">
    <rect x="0" y="0" width="100" height="32" fill="#1A1A2E"/>
    <text x="50" y="21" class="font-bold" fill="#FFFFFF" font-size="11" letter-spacing="1" text-anchor="middle">SCHÉMA 1</text>
    <rect x="105" y="0" width="100" height="32" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="1"/>
    <text x="155" y="21" class="font-bold" fill="#1A1A2E" font-size="11" letter-spacing="1" text-anchor="middle">SCHÉMA 2</text>
    <rect x="215" y="4" width="28" height="24" fill="none" stroke="#1A1A2E" stroke-width="1" stroke-dasharray="4,3" rx="2"/>
    <text x="229" y="21" class="font-bold" fill="#1A1A2E" font-size="14" text-anchor="middle" opacity="0.4">+</text>
  </g>

  <!-- Court Schema -->
  <g transform="translate(600, 275)">
    <!-- Frame with geometric corners -->
    <rect width="540" height="280" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="3"/>
    <!-- Corner decorations -->
    <rect x="-6" y="-6" width="16" height="16" fill="#E8553D"/>
    <rect x="530" y="-6" width="16" height="16" fill="#1A8A7D"/>
    <rect x="-6" y="270" width="16" height="16" fill="#F2B705"/>
    <rect x="530" y="270" width="16" height="16" fill="#1A1A2E"/>

    <!-- Court background -->
    <rect x="15" y="15" width="510" height="250" fill="#3D8B6E"/>
    <!-- Court lines -->
    <line x1="270" y1="15" x2="270" y2="265" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    <circle cx="270" cy="140" r="40" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    <!-- Goal areas -->
    <path d="M 15,70 Q 70,140 15,210" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    <path d="M 525,70 Q 470,140 525,210" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    <!-- 6m lines -->
    <path d="M 15,90 Q 55,140 15,190" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <path d="M 525,90 Q 485,140 525,190" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

    <!-- Red team (attackers) -->
    <circle cx="120" cy="80" r="10" fill="#E8553D"/>
    <text x="120" y="84" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">1</text>
    <circle cx="150" cy="130" r="10" fill="#E8553D"/>
    <text x="150" y="134" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">2</text>
    <circle cx="120" cy="180" r="10" fill="#E8553D"/>
    <text x="120" y="184" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">3</text>
    <circle cx="180" cy="100" r="10" fill="#E8553D"/>
    <text x="180" y="104" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">4</text>
    <circle cx="180" cy="160" r="10" fill="#E8553D"/>
    <text x="180" y="164" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">5</text>

    <!-- Yellow team (defenders) -->
    <circle cx="350" cy="85" r="10" fill="#F2B705"/>
    <text x="350" y="89" class="font-bold" fill="#1A1A2E" font-size="10" text-anchor="middle">1</text>
    <circle cx="380" cy="140" r="10" fill="#F2B705"/>
    <text x="380" y="144" class="font-bold" fill="#1A1A2E" font-size="10" text-anchor="middle">2</text>
    <circle cx="350" cy="195" r="10" fill="#F2B705"/>
    <text x="350" y="199" class="font-bold" fill="#1A1A2E" font-size="10" text-anchor="middle">3</text>

    <!-- Ball -->
    <circle cx="155" cy="130" r="5" fill="#1A8A7D"/>

    <!-- Trajectories -->
    <line x1="120" y1="80" x2="180" y2="100" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
    <polygon points="178,95 185,100 178,105" fill="#FFFFFF" opacity="0.8"/>
    <line x1="180" y1="100" x2="350" y2="85" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.8"/>
    <polygon points="345,80 355,85 345,90" fill="#FFFFFF" opacity="0.8"/>

    <!-- Plots -->
    <polygon points="220,110 225,100 230,110" fill="#F2B705" stroke="#1A1A2E" stroke-width="1"/>
    <polygon points="220,170 225,160 230,170" fill="#F2B705" stroke="#1A1A2E" stroke-width="1"/>
    <polygon points="300,140 305,130 310,140" fill="#F2B705" stroke="#1A1A2E" stroke-width="1"/>
  </g>

  <!-- ==================== DESCRIPTION SECTIONS ==================== -->
  <g transform="translate(600, 580)">
    <!-- À FAIRE -->
    <rect x="0" y="0" width="540" height="65" fill="#FFFFFF"/>
    <rect x="0" y="0" width="5" height="65" fill="#E8553D"/>
    <circle cx="25" cy="20" r="5" fill="#E8553D"/>
    <text x="40" y="24" class="font-bold" fill="#E8553D" font-size="13" letter-spacing="1">À FAIRE</text>
    <text x="25" y="48" class="font-light" fill="#1A1A2E" font-size="13">Placement des joueurs en quinconce sur la largeur du terrain. Les attaquants</text>
    <text x="25" y="64" class="font-light" fill="#1A1A2E" font-size="13" opacity="0.7">progressent par passes courtes, les défenseurs reculent en maintenant la ligne.</text>

    <!-- À VÉRIFIER -->
    <rect x="0" y="80" width="540" height="65" fill="#FFFFFF"/>
    <rect x="0" y="80" width="5" height="65" fill="#1A8A7D"/>
    <circle cx="25" cy="100" r="5" fill="#1A8A7D"/>
    <text x="40" y="104" class="font-bold" fill="#1A8A7D" font-size="13" letter-spacing="1">À VÉRIFIER</text>
    <text x="25" y="128" class="font-light" fill="#1A1A2E" font-size="13">Alignement des 5 défenseurs sur la même ligne. Communication entre les</text>
    <text x="25" y="144" class="font-light" fill="#1A1A2E" font-size="13" opacity="0.7">postes pour les permutations. Vitesse de replacement après chaque passe.</text>

    <!-- À DIRE -->
    <rect x="0" y="160" width="540" height="65" fill="#FFFFFF"/>
    <rect x="0" y="160" width="5" height="65" fill="#F2B705"/>
    <circle cx="25" cy="180" r="5" fill="#F2B705"/>
    <text x="40" y="184" class="font-bold" fill="#F2B705" font-size="13" letter-spacing="1">À DIRE</text>
    <text x="25" y="208" class="font-light" fill="#1A1A2E" font-size="13">"On recule ensemble !" — insister sur la communication vocale entre</text>
    <text x="25" y="224" class="font-light" fill="#1A1A2E" font-size="13" opacity="0.7">les défenseurs et le timing du replacement collectif.</text>
  </g>

  <!-- Right side keywords -->
  <g transform="translate(1160, 275)">
    <text x="0" y="15" class="font-bold" fill="#1A1A2E" font-size="11" letter-spacing="1.5">MOTS-CLÉS</text>
    <rect x="0" y="25" width="30" height="3" fill="#E8553D"/>
    <rect x="0" y="40" width="90" height="26" fill="#1A1A2E" rx="2"/>
    <text x="45" y="57" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">DÉFENSE</text>
    <rect x="0" y="72" width="70" height="26" fill="#1A1A2E" rx="2"/>
    <text x="35" y="89" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">REPLI</text>
    <rect x="0" y="104" width="110" height="26" fill="#1A1A2E" rx="2"/>
    <text x="55" y="121" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">ÉCHAUFFEMENT</text>
    <rect x="0" y="136" width="60" height="26" fill="#1A1A2E" rx="2"/>
    <text x="30" y="153" class="font-bold" fill="#FFFFFF" font-size="10" text-anchor="middle">1-5</text>
  </g>

  <!-- ==================== BOTTOM ACTION BAR ==================== -->
  <rect x="260" y="840" width="1180" height="60" fill="#FFFFFF"/>
  <line x1="260" y1="840" x2="1440" y2="840" stroke="#1A1A2E" stroke-width="0.5" opacity="0.1"/>

  <!-- Buttons -->
  <rect x="1160" y="852" width="140" height="38" fill="#E8553D"/>
  <text x="1230" y="876" class="font-bold" fill="#FFFFFF" font-size="13" letter-spacing="1" text-anchor="middle">SAUVEGARDER</text>

  <rect x="1000" y="852" width="140" height="38" fill="none" stroke="#1A1A2E" stroke-width="2"/>
  <text x="1070" y="876" class="font-bold" fill="#1A1A2E" font-size="13" letter-spacing="1" text-anchor="middle">EXPORTER</text>

  <rect x="310" y="852" width="110" height="38" fill="#1A1A2E"/>
  <text x="365" y="876" class="font-bold" fill="#FFFFFF" font-size="13" letter-spacing="1" text-anchor="middle">RETOUR</text>

  <!-- Decorative triangles in margins -->
  <polygon points="1420,170 1440,145 1440,195" fill="#F2B705" opacity="0.15"/>
  <polygon points="1380,830 1400,810 1420,830" fill="#E8553D" opacity="0.08"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .font-black { font-family: 'Inter', 'Arial Black', sans-serif; font-weight: 900; }
      .font-bold { font-family: 'Inter', Arial, sans-serif; font-weight: 700; }
      .font-light { font-family: 'Inter', Arial, sans-serif; font-weight: 300; }
      .font-regular { font-family: 'Inter', Arial, sans-serif; font-weight: 400; }
    </style>
    <!-- Subtle handball watermark -->
    <pattern id="watermark" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      <circle cx="200" cy="200" r="150" fill="none" stroke="#1A1A2E" stroke-width="2" opacity="0.03"/>
      <circle cx="200" cy="200" r="60" fill="none" stroke="#1A1A2E" stroke-width="1.5" opacity="0.02"/>
      <line x1="200" y1="50" x2="200" y2="350" stroke="#1A1A2E" stroke-width="1" opacity="0.015"/>
      <line x1="50" y1="200" x2="350" y2="200" stroke="#1A1A2E" stroke-width="1" opacity="0.015"/>
    </pattern>
  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1440" height="900" fill="#FAF7F2"/>
  <rect width="1440" height="900" fill="url(#watermark)"/>

  <!-- ==================== COLLAPSED SIDEBAR ==================== -->
  <rect width="56" height="900" fill="#1A1A2E"/>
  <!-- Logo icon -->
  <circle cx="28" cy="32" r="14" fill="none" stroke="#E8553D" stroke-width="2"/>
  <circle cx="28" cy="32" r="5" fill="#E8553D" opacity="0.4"/>

  <line x1="12" y1="60" x2="44" y2="60" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>

  <!-- Minimal nav icons -->
  <!-- Training icon (active) -->
  <rect x="16" y="75" width="24" height="24" fill="none" stroke="#E8553D" stroke-width="1.5" rx="0"/>
  <rect x="0" y="75" width="4" height="24" fill="#E8553D"/>

  <!-- Groups icon -->
  <rect x="16" y="115" width="24" height="24" fill="none" stroke="#FFFFFF" stroke-width="1" rx="0" opacity="0.4"/>

  <!-- Community icon -->
  <circle cx="28" cy="165" r="12" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

  <!-- Profile icon -->
  <circle cx="28" cy="210" r="12" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <circle cx="28" cy="206" r="5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

  <!-- ==================== TOP BAR ==================== -->
  <rect x="56" y="0" width="1384" height="56" fill="#FFFFFF"/>
  <line x1="56" y1="56" x2="1440" y2="56" stroke="#1A1A2E" stroke-width="0.5" opacity="0.1"/>

  <!-- Breadcrumb -->
  <text x="80" y="24" class="font-regular" fill="#1A1A2E" font-size="11" opacity="0.5">Entraînements / Défense 1-5 repli / Situation 1</text>
  <text x="80" y="43" class="font-bold" fill="#1A1A2E" font-size="15" letter-spacing="0.5">SCHÉMA 1 — ÉCHAUFFEMENT DÉFENSIF</text>

  <!-- Save/Back buttons top right -->
  <rect x="1190" y="12" width="100" height="34" fill="#1A1A2E"/>
  <text x="1240" y="34" class="font-bold" fill="#FFFFFF" font-size="11" letter-spacing="1" text-anchor="middle">RETOUR</text>

  <rect x="1305" y="12" width="120" height="34" fill="#E8553D"/>
  <text x="1365" y="34" class="font-bold" fill="#FFFFFF" font-size="11" letter-spacing="1" text-anchor="middle">SAUVEGARDER</text>

  <!-- ==================== TOOLBAR ==================== -->
  <rect x="56" y="56" width="1384" height="52" fill="#FFFFFF"/>
  <line x1="56" y1="108" x2="1440" y2="108" stroke="#1A1A2E" stroke-width="1" opacity="0.15"/>

  <!-- Tool groups -->
  <g transform="translate(80, 65)">
    <!-- Selection tool (active) -->
    <g>
      <circle cx="18" cy="18" r="18" fill="#E8553D" opacity="0.15"/>
      <polygon points="12,8 28,18 12,28" fill="none" stroke="#E8553D" stroke-width="2"/>
      <text x="18" y="48" class="font-regular" fill="#E8553D" font-size="8" text-anchor="middle" letter-spacing="0.5">SÉLECT.</text>
    </g>

    <line x1="50" y1="5" x2="50" y2="33" stroke="#1A1A2E" stroke-width="0.5" opacity="0.15"/>

    <!-- Player tool -->
    <g transform="translate(65, 0)">
      <circle cx="18" cy="18" r="12" fill="none" stroke="#1A1A2E" stroke-width="1.5"/>
      <text x="18" y="22" class="font-bold" fill="#1A1A2E" font-size="10" text-anchor="middle">J</text>
      <text x="18" y="48" class="font-regular" fill="#1A1A2E" font-size="8" text-anchor="middle" letter-spacing="0.5" opacity="0.6">JOUEUR</text>
    </g>

    <!-- Plot tool -->
    <g transform="translate(120, 0)">
      <polygon points="18,6 28,30 8,30" fill="none" stroke="#1A1A2E" stroke-width="1.5"/>
      <text x="18" y="48" class="font-regular" fill="#1A1A2E" font-size="8" text-anchor="middle" letter-spacing="0.5" opacity="0.6">PLOT</text>
    </g>

    <!-- Ball tool -->
    <g transform="translate(175, 0)">
      <circle cx="18" cy="18" r="8" fill="none" stroke="#1A1A2E" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="3" fill="#1A1A2E" opacity="0.3"/>
      <text x="18" y="48" class="font-regular" fill="#1A1A2E" font-size="8" text-anchor="middle" letter-spacing="0.5" opacity="0.6">BALLON</text>
    </g>

    <line x1="210" y1="5" x2="210" y2="33" stroke="#1A1A2E" stroke-width="0.5" opacity="0.15"/>

    <!-- Trajectory tool -->
    <g transform="translate(225, 0)">
      <line x1="6" y1="28" x2="30" y2="8" stroke="#1A1A2E" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="28,4 34,10 26,12" fill="#1A1A2E"/>
      <text x="18" y="48" class="font-regular" fill="#1A1A2E" font-size="8" text-anchor="middle" letter-spacing="0.5" opacity="0.6">TRAJECT.</text>
    </g>

    <!-- Separator tool -->
    <g transform="translate(290, 0)">
      <line x1="8" y1="8" x2="28" y2="28" stroke="#1A1A2E" stroke-width="1.5"/>
      <line x1="28" y1="8" x2="8" y2="28" stroke="#1A1A2E" stroke-width="0.8" opacity="0.3"/>
      <text x="18" y="48" class="font-regular" fill="#1A1A2E" font-size="8" text-anchor="middle" letter-spacing="0.5" opacity="0.6">SÉPAR.</text>
    </g>

    <line x1="325" y1="5" x2="325" y2="33" stroke="#1A1A2E" stroke-width="0.5" opacity="0.15"/>

    <!-- Text tool -->
    <g transform="translate(340, 0)">
      <text x="18" y="24" class="font-black" fill="#1A1A2E" font-size="20" text-anchor="middle">T</text>
      <text x="18" y="48" class="font-regular" fill="#1A1A2E" font-size="8" text-anchor="middle" letter-spacing="0.5" opacity="0.6">TEXTE</text>
    </g>

    <!-- Shape tool -->
    <g transform="translate(395, 0)">
      <rect x="6" y="6" width="24" height="24" fill="none" stroke="#1A1A2E" stroke-width="1.5"/>
      <text x="18" y="48" class="font-regular" fill="#1A1A2E" font-size="8" text-anchor="middle" letter-spacing="0.5" opacity="0.6">FORME</text>
    </g>

    <line x1="440" y1="5" x2="440" y2="33" stroke="#1A1A2E" stroke-width="0.5" opacity="0.15"/>

    <!-- Undo -->
    <g transform="translate(455, 0)">
      <path d="M 10,20 Q 10,10 20,10 L 26,10" fill="none" stroke="#1A1A2E" stroke-width="1.5" opacity="0.5"/>
      <polygon points="8,20 14,14 14,26" fill="#1A1A2E" opacity="0.5"/>
    </g>
    <!-- Redo -->
    <g transform="translate(490, 0)">
      <path d="M 26,20 Q 26,10 16,10 L 10,10" fill="none" stroke="#1A1A2E" stroke-width="1.5" opacity="0.3"/>
      <polygon points="28,20 22,14 22,26" fill="#1A1A2E" opacity="0.3"/>
    </g>

    <line x1="525" y1="5" x2="525" y2="33" stroke="#1A1A2E" stroke-width="0.5" opacity="0.15"/>

    <!-- Zoom controls -->
    <g transform="translate(545, 0)">
      <text x="0" y="24" class="font-regular" fill="#1A1A2E" font-size="13" opacity="0.6">−</text>
      <text x="25" y="22" class="font-bold" fill="#1A1A2E" font-size="11">100%</text>
      <text x="70" y="24" class="font-regular" fill="#1A1A2E" font-size="13" opacity="0.6">+</text>
    </g>

    <!-- Layout toggle -->
    <g transform="translate(660, 0)">
      <rect x="0" y="5" width="70" height="26" fill="#1A1A2E" rx="2"/>
      <text x="35" y="23" class="font-bold" fill="#FFFFFF" font-size="9" letter-spacing="0.5" text-anchor="middle">ENTIER</text>
      <rect x="75" y="5" width="55" height="26" fill="none" stroke="#1A1A2E" stroke-width="1" rx="2"/>
      <text x="102" y="23" class="font-bold" fill="#1A1A2E" font-size="9" letter-spacing="0.5" text-anchor="middle">DEMI</text>
    </g>
  </g>

  <!-- ==================== COURT AREA ==================== -->
  <!-- Navy frame -->
  <rect x="106" y="128" width="1284" height="732" fill="#1A1A2E"/>
  <!-- Inner court -->
  <rect x="116" y="138" width="1264" height="712" fill="#3D8B6E"/>

  <!-- Corner decorations -->
  <rect x="106" y="128" width="20" height="20" fill="#E8553D"/>
  <rect x="1370" y="128" width="20" height="20" fill="#1A8A7D"/>
  <rect x="106" y="840" width="20" height="20" fill="#F2B705"/>
  <rect x="1370" y="840" width="20" height="20" fill="#E8553D"/>

  <!-- Court markings -->
  <!-- Center line -->
  <line x1="748" y1="138" x2="748" y2="850" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <!-- Center circle -->
  <circle cx="748" cy="494" r="60" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <!-- Left goal area (9m arc) -->
  <path d="M 116,340 Q 230,494 116,648" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <!-- Left 6m area -->
  <path d="M 116,380 Q 195,494 116,608" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.45"/>
  <!-- Left goal -->
  <rect x="112" y="464" width="8" height="60" fill="#FFFFFF" opacity="0.5"/>

  <!-- Right goal area (9m arc) -->
  <path d="M 1380,340 Q 1266,494 1380,648" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <!-- Right 6m area -->
  <path d="M 1380,380 Q 1301,494 1380,608" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.45"/>
  <!-- Right goal -->
  <rect x="1376" y="464" width="8" height="60" fill="#FFFFFF" opacity="0.5"/>

  <!-- 7m marks -->
  <line x1="175" y1="490" x2="175" y2="498" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <line x1="1321" y1="490" x2="1321" y2="498" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>

  <!-- ==================== PLAYERS - RED TEAM (Coral Hexagons) ==================== -->
  <!-- Player 1 -->
  <g transform="translate(280, 320)">
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#E8553D" stroke="#C4422F" stroke-width="1.5"/>
    <text x="0" y="5" class="font-bold" fill="#FFFFFF" font-size="13" text-anchor="middle">1</text>
  </g>
  <!-- Player 2 -->
  <g transform="translate(320, 440)">
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#E8553D" stroke="#C4422F" stroke-width="1.5"/>
    <text x="0" y="5" class="font-bold" fill="#FFFFFF" font-size="13" text-anchor="middle">2</text>
  </g>
  <!-- Player 3 -->
  <g transform="translate(280, 560)">
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#E8553D" stroke="#C4422F" stroke-width="1.5"/>
    <text x="0" y="5" class="font-bold" fill="#FFFFFF" font-size="13" text-anchor="middle">3</text>
  </g>
  <!-- Player 4 -->
  <g transform="translate(380, 380)">
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#E8553D" stroke="#C4422F" stroke-width="1.5"/>
    <text x="0" y="5" class="font-bold" fill="#FFFFFF" font-size="13" text-anchor="middle">4</text>
  </g>
  <!-- Player 5 -->
  <g transform="translate(380, 520)">
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#E8553D" stroke="#C4422F" stroke-width="1.5"/>
    <text x="0" y="5" class="font-bold" fill="#FFFFFF" font-size="13" text-anchor="middle">5</text>
  </g>
  <!-- Player 6 -->
  <g transform="translate(450, 450)">
    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#E8553D" stroke="#C4422F" stroke-width="1.5"/>
    <text x="0" y="5" class="font-bold" fill="#FFFFFF" font-size="13" text-anchor="middle">6</text>
  </g>

  <!-- ==================== PLAYERS - YELLOW TEAM (Golden Pentagons) ==================== -->
  <!-- Player 1 -->
  <g transform="translate(1000, 350)">
    <polygon points="0,-18 17,-6 11,16 -11,16 -17,-6" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
    <text x="0" y="4" class="font-bold" fill="#1A1A2E" font-size="13" text-anchor="middle">1</text>
  </g>
  <!-- Player 2 -->
  <g transform="translate(1050, 470)">
    <polygon points="0,-18 17,-6 11,16 -11,16 -17,-6" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
    <text x="0" y="4" class="font-bold" fill="#1A1A2E" font-size="13" text-anchor="middle">2</text>
  </g>
  <!-- Player 3 -->
  <g transform="translate(1000, 590)">
    <polygon points="0,-18 17,-6 11,16 -11,16 -17,-6" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
    <text x="0" y="4" class="font-bold" fill="#1A1A2E" font-size="13" text-anchor="middle">3</text>
  </g>
  <!-- Player 4 -->
  <g transform="translate(1120, 400)">
    <polygon points="0,-18 17,-6 11,16 -11,16 -17,-6" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
    <text x="0" y="4" class="font-bold" fill="#1A1A2E" font-size="13" text-anchor="middle">4</text>
  </g>
  <!-- Player 5 -->
  <g transform="translate(1120, 540)">
    <polygon points="0,-18 17,-6 11,16 -11,16 -17,-6" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
    <text x="0" y="4" class="font-bold" fill="#1A1A2E" font-size="13" text-anchor="middle">5</text>
  </g>

  <!-- ==================== BALL ==================== -->
  <circle cx="460" cy="450" r="9" fill="#1A8A7D" stroke="#158073" stroke-width="1.5"/>
  <circle cx="460" cy="450" r="4" fill="#FFFFFF" opacity="0.3"/>

  <!-- ==================== TRAJECTORIES ==================== -->
  <!-- Pass trajectory: Player 1 to Player 4 -->
  <line x1="296" y1="320" x2="364" y2="380" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="10,6" opacity="0.85"/>
  <polygon points="362,374 372,382 360,386" fill="#FFFFFF" opacity="0.85"/>

  <!-- Pass trajectory: Player 4 to Player 6 -->
  <line x1="396" y1="380" x2="434" y2="450" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="10,6" opacity="0.85"/>
  <polygon points="430,444 440,454 428,456" fill="#FFFFFF" opacity="0.85"/>

  <!-- Run trajectory: Player 6 forward -->
  <line x1="466" y1="450" x2="600" y2="450" stroke="#E8553D" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
  <polygon points="596,443 606,450 596,457" fill="#E8553D" opacity="0.7"/>

  <!-- Defensive retreat trajectory -->
  <line x1="984" y1="350" x2="900" y2="350" stroke="#F2B705" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <polygon points="904,343 894,350 904,357" fill="#F2B705" opacity="0.6"/>

  <line x1="1034" y1="470" x2="950" y2="470" stroke="#F2B705" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <polygon points="954,463 944,470 954,477" fill="#F2B705" opacity="0.6"/>

  <!-- ==================== PLOTS ==================== -->
  <polygon points="550,350 558,332 566,350" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
  <polygon points="550,550 558,532 566,550" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
  <polygon points="650,440 658,422 666,440" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
  <polygon points="650,510 658,492 666,510" fill="#F2B705" stroke="#D9A004" stroke-width="1.5"/>
  <polygon points="750,380 758,362 766,380" fill="#E8553D" stroke="#C4422F" stroke-width="1.5"/>
  <polygon points="750,580 758,562 766,580" fill="#E8553D" stroke="#C4422F" stroke-width="1.5"/>

  <!-- ==================== TEXT LABEL ON COURT ==================== -->
  <g transform="translate(580, 240)">
    <rect x="0" y="0" width="160" height="30" fill="#1A1A2E" opacity="0.8" rx="2"/>
    <text x="80" y="20" class="font-bold" fill="#FFFFFF" font-size="11" letter-spacing="0.5" text-anchor="middle">ZONE DE REPLI</text>
  </g>

  <g transform="translate(850, 700)">
    <rect x="0" y="0" width="180" height="30" fill="#1A1A2E" opacity="0.8" rx="2"/>
    <text x="90" y="20" class="font-bold" fill="#FFFFFF" font-size="11" letter-spacing="0.5" text-anchor="middle">ZONE D'ATTAQUE</text>
  </g>

  <!-- ==================== SEPARATION LINE ==================== -->
  <line x1="700" y1="200" x2="700" y2="780" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="12,8" opacity="0.35"/>
</svg>
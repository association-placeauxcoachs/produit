<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .font-black { font-family: 'Inter', 'Arial Black', sans-serif; font-weight: 900; }
      .font-bold { font-family: 'Inter', Arial, sans-serif; font-weight: 700; }
      .font-light { font-family: 'Inter', Arial, sans-serif; font-weight: 300; }
      .font-regular { font-family: 'Inter', Arial, sans-serif; font-weight: 400; }
    </style>
    <clipPath id="hero-clip">
      <rect x="0" y="70" width="1440" height="490"/>
    </clipPath>
    <pattern id="geo-pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <line x1="0" y1="0" x2="60" y2="60" stroke="#F2B705" stroke-width="0.5" opacity="0.3"/>
      <line x1="60" y1="0" x2="0" y2="60" stroke="#E8553D" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <pattern id="footer-pattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none"/>
      <circle cx="40" cy="40" r="20" fill="none" stroke="#F2B705" stroke-width="0.5" opacity="0.15"/>
      <rect x="10" y="10" width="20" height="20" fill="none" stroke="#1A8A7D" stroke-width="0.5" opacity="0.1" transform="rotate(45 20 20)"/>
    </pattern>
  </defs>

  <!-- ==================== NAVBAR ==================== -->
  <rect width="1440" height="70" fill="#1A1A2E"/>
  <!-- Logo handball icon -->
  <circle cx="45" cy="35" r="18" fill="none" stroke="#E8553D" stroke-width="2.5"/>
  <circle cx="45" cy="35" r="8" fill="#E8553D" opacity="0.3"/>
  <line x1="45" y1="17" x2="45" y2="53" stroke="#E8553D" stroke-width="1.5" opacity="0.5"/>
  <line x1="27" y1="35" x2="63" y2="35" stroke="#E8553D" stroke-width="1.5" opacity="0.5"/>
  <text x="72" y="40" class="font-bold" fill="#FFFFFF" font-size="16" letter-spacing="1">PLACE AUX COACHS</text>
  <!-- Nav items -->
  <text x="680" y="40" class="font-bold" fill="#FFFFFF" font-size="12" letter-spacing="2" opacity="0.8">FONCTIONNALITÉS</text>
  <text x="840" y="40" class="font-bold" fill="#FFFFFF" font-size="12" letter-spacing="2" opacity="0.8">COMMUNAUTÉ</text>
  <text x="980" y="40" class="font-bold" fill="#FFFFFF" font-size="12" letter-spacing="2" opacity="0.8">TARIFS</text>
  <!-- CTA Button -->
  <rect x="1260" y="15" width="150" height="40" fill="#E8553D"/>
  <text x="1335" y="40" class="font-bold" fill="#FFFFFF" font-size="13" letter-spacing="1.5" text-anchor="middle">COMMENCER</text>

  <!-- ==================== HERO SECTION ==================== -->
  <rect y="70" width="1440" height="490" fill="#FAF7F2"/>

  <!-- Diagonal teal block -->
  <g clip-path="url(#hero-clip)">
    <polygon points="780,70 1440,70 1440,560 880,560" fill="#1A8A7D"/>
    <rect x="780" y="70" width="660" height="490" fill="url(#geo-pattern)" opacity="0.4"/>
  </g>

  <!-- Decorative geometric shapes -->
  <circle cx="120" cy="480" r="60" fill="#F2B705" opacity="0.12"/>
  <rect x="200" y="440" width="40" height="40" fill="#E8553D" opacity="0.08" transform="rotate(45 220 460)"/>
  <polygon points="680,120 700,90 720,120" fill="#1A1A2E" opacity="0.08"/>
  <line x1="100" y1="200" x2="100" y2="320" stroke="#E8553D" stroke-width="3" opacity="0.2"/>

  <!-- Large geometric handball shape overlapping diagonal -->
  <g transform="translate(810, 220)" opacity="0.15">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#F2B705" stroke-width="1.5"/>
  </g>

  <!-- Hero text -->
  <text x="120" y="200" class="font-black" fill="#1A1A2E" font-size="62" letter-spacing="-1">NE COACHEZ</text>
  <text x="120" y="270" class="font-black" fill="#E8553D" font-size="72" letter-spacing="-1">PLUS JAMAIS</text>
  <text x="120" y="340" class="font-black" fill="#1A1A2E" font-size="62" letter-spacing="-1">SEUL.</text>

  <text x="120" y="390" class="font-light" fill="#1A1A2E" font-size="18" opacity="0.7">Créez, partagez et perfectionnez vos entraînements</text>
  <text x="120" y="415" class="font-light" fill="#1A1A2E" font-size="18" opacity="0.7">de handball avec une communauté de coachs passionnés.</text>

  <!-- CTA Button hero -->
  <rect x="120" y="445" width="260" height="56" fill="#E8553D"/>
  <text x="250" y="479" class="font-bold" fill="#FFFFFF" font-size="16" letter-spacing="2" text-anchor="middle">CRÉER MON COMPTE</text>
  <line x1="360" y1="473" x2="340" y2="473" stroke="#FFFFFF" stroke-width="2"/>
  <polyline points="352,465 362,473 352,481" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Right side content on teal -->
  <g transform="translate(980, 200)">
    <rect x="0" y="0" width="340" height="220" fill="#FFFFFF" opacity="0.1" rx="0"/>
    <rect x="20" y="20" width="300" height="140" fill="#FFFFFF" opacity="0.15"/>
    <!-- Mini court preview -->
    <rect x="40" y="35" width="260" height="110" fill="#2E8B7A" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    <circle cx="170" cy="90" r="30" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="90" x2="300" y2="90" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4"/>
    <rect x="40" y="35" width="40" height="110" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" rx="0"/>
    <rect x="260" y="35" width="40" height="110" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.4" rx="0"/>
    <circle cx="100" cy="70" r="6" fill="#E8553D" opacity="0.9"/>
    <circle cx="130" cy="100" r="6" fill="#E8553D" opacity="0.9"/>
    <circle cx="200" cy="75" r="6" fill="#F2B705" opacity="0.9"/>
    <circle cx="230" cy="105" r="6" fill="#F2B705" opacity="0.9"/>
    <text x="20" y="190" class="font-bold" fill="#FFFFFF" font-size="13" opacity="0.9">Éditeur visuel intuitif</text>
    <text x="20" y="210" class="font-light" fill="#FFFFFF" font-size="11" opacity="0.7">Glissez-déposez joueurs, plots et trajectoires</text>
  </g>

  <!-- ==================== FEATURES SECTION ==================== -->
  <rect y="560" width="1440" height="340" fill="#FFFFFF"/>

  <text x="120" y="610" class="font-black" fill="#1A1A2E" font-size="36" letter-spacing="-0.5">TOUT CE DONT VOUS AVEZ BESOIN</text>
  <rect x="120" y="620" width="80" height="4" fill="#E8553D"/>

  <!-- Feature Card 1 -->
  <g transform="translate(120, 650)">
    <rect width="360" height="200" fill="#FAF7F2" stroke="none"/>
    <rect width="5" height="200" fill="#E8553D"/>
    <circle cx="340" cy="20" r="28" fill="#E8553D"/>
    <text x="340" y="28" class="font-black" fill="#FFFFFF" font-size="22" text-anchor="middle">1</text>
    <text x="30" y="45" class="font-bold" fill="#1A1A2E" font-size="20" letter-spacing="0.5">CRÉEZ</text>
    <text x="30" y="80" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">Dessinez vos exercices sur un terrain</text>
    <text x="30" y="100" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">interactif. Positionnez joueurs, plots,</text>
    <text x="30" y="120" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">ballons et trajectoires en quelques clics.</text>
    <rect x="30" y="140" width="40" height="40" fill="#E8553D" opacity="0.1"/>
    <line x1="40" y1="152" x2="58" y2="168" stroke="#E8553D" stroke-width="2"/>
    <line x1="40" y1="168" x2="40" y2="152" stroke="#E8553D" stroke-width="2"/>
  </g>

  <!-- Feature Card 2 -->
  <g transform="translate(540, 650)">
    <rect width="360" height="200" fill="#FAF7F2" stroke="none"/>
    <rect width="5" height="200" fill="#1A8A7D"/>
    <circle cx="340" cy="20" r="28" fill="#1A8A7D"/>
    <text x="340" y="28" class="font-black" fill="#FFFFFF" font-size="22" text-anchor="middle">2</text>
    <text x="30" y="45" class="font-bold" fill="#1A1A2E" font-size="20" letter-spacing="0.5">PARTAGEZ</text>
    <text x="30" y="80" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">Rejoignez des groupes de travail et</text>
    <text x="30" y="100" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">collaborez avec d'autres entraîneurs.</text>
    <text x="30" y="120" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">Échangez vos meilleures séances.</text>
    <rect x="30" y="140" width="40" height="40" fill="#1A8A7D" opacity="0.1"/>
    <line x1="40" y1="160" x2="60" y2="160" stroke="#1A8A7D" stroke-width="2"/>
    <polygon points="56,154 64,160 56,166" fill="#1A8A7D"/>
  </g>

  <!-- Feature Card 3 -->
  <g transform="translate(960, 650)">
    <rect width="360" height="200" fill="#FAF7F2" stroke="none"/>
    <rect width="5" height="200" fill="#F2B705"/>
    <circle cx="340" cy="20" r="28" fill="#F2B705"/>
    <text x="340" y="28" class="font-black" fill="#1A1A2E" font-size="22" text-anchor="middle">3</text>
    <text x="30" y="45" class="font-bold" fill="#1A1A2E" font-size="20" letter-spacing="0.5">PROGRESSEZ</text>
    <text x="30" y="80" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">Suivez la maturité de vos entraînements</text>
    <text x="30" y="100" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">et exportez-les en PDF. Accédez à votre</text>
    <text x="30" y="120" class="font-light" fill="#1A1A2E" font-size="14" opacity="0.7">bibliothèque d'exercices n'importe où.</text>
    <rect x="30" y="140" width="40" height="40" fill="#F2B705" opacity="0.1"/>
    <polygon points="50,150 60,170 40,170" fill="#F2B705"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="1380" cy="600" r="35" fill="none" stroke="#F2B705" stroke-width="2" opacity="0.3"/>
  <rect x="60" y="680" width="20" height="20" fill="#1A8A7D" opacity="0.08" transform="rotate(45 70 690)"/>
  <line x1="1350" y1="700" x2="1350" y2="830" stroke="#E8553D" stroke-width="2" opacity="0.15"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .font-urban { font-family: 'Urbanist', sans-serif; }
      .font-inter { font-family: 'Inter', sans-serif; }
    </style>
    <linearGradient id="bgPastel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F8F5FF"/>
      <stop offset="50%" stop-color="#FFF8F5"/>
      <stop offset="100%" stop-color="#F3F0FF"/>
    </linearGradient>
    <linearGradient id="ctaViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="courtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <radialGradient id="blobPeach" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD4B8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFD4B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="courtShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#7C5CFC" flood-opacity="0.1"/>
    </filter>
    <filter id="btnShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#7C5CFC" flood-opacity="0.2"/>
    </filter>
    <filter id="toolbarShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#7C5CFC" flood-opacity="0.06"/>
    </filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- BG -->
  <rect width="390" height="844" fill="url(#bgPastel)"/>
  <ellipse cx="360" cy="700" rx="120" ry="100" fill="url(#blobPeach)" filter="url(#softGlow)"/>

  <!-- TOP HEADER -->
  <rect width="390" height="48" fill="#ffffff" opacity="0.88"/>
  <line x1="0" y1="48" x2="390" y2="48" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>

  <!-- Back -->
  <rect x="8" y="10" width="28" height="28" rx="8" fill="#7C5CFC" opacity="0.05"/>
  <text x="22" y="29" class="font-urban" fill="#1E1340" font-size="16" text-anchor="middle" opacity="0.4">‹</text>

  <!-- Title -->
  <text x="48" y="30" class="font-urban" fill="#1E1340" font-size="12" font-weight="700">01 — Échauffement</text>

  <!-- Save button -->
  <rect x="310" y="10" width="68" height="28" rx="14" fill="url(#ctaViolet)" filter="url(#btnShadow)"/>
  <text x="344" y="29" class="font-urban" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Sauver</text>

  <!-- FLOATING TOOLBAR (horizontal, below header) -->
  <g transform="translate(12, 58)" filter="url(#toolbarShadow)">
    <rect width="366" height="42" rx="12" fill="#ffffff" opacity="0.94"/>

    <!-- Layout -->
    <rect x="6" y="5" width="32" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <rect x="14" y="13" width="6" height="16" rx="1.5" fill="none" stroke="#1E1340" stroke-width="1" opacity="0.3"/>
    <rect x="23" y="13" width="6" height="16" rx="1.5" fill="none" stroke="#1E1340" stroke-width="1" opacity="0.3"/>

    <!-- Cursor — ACTIVE -->
    <rect x="42" y="5" width="32" height="32" rx="8" fill="#F06850" opacity="0.1" stroke="#F06850" stroke-width="1.2" stroke-opacity="0.4"/>
    <path d="M 54 13 L 54 29 L 58 25 L 62 27 L 60 23 L 64 21 Z" fill="#F06850" opacity="0.7"/>

    <!-- Player -->
    <rect x="78" y="5" width="32" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <circle cx="94" cy="21" r="6" fill="none" stroke="#1E1340" stroke-width="1" opacity="0.3"/>
    <circle cx="94" cy="18" r="2.5" fill="none" stroke="#1E1340" stroke-width="0.8" opacity="0.3"/>

    <!-- Cone -->
    <rect x="114" y="5" width="32" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <polygon points="130,13 125,29 135,29" fill="none" stroke="#1E1340" stroke-width="1" opacity="0.3"/>

    <!-- Ball -->
    <rect x="150" y="5" width="32" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <circle cx="166" cy="21" r="6" fill="none" stroke="#1E1340" stroke-width="1" opacity="0.3"/>

    <!-- Trajectory -->
    <rect x="186" y="5" width="32" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <path d="M 196 27 Q 202 13 212 17" fill="none" stroke="#1E1340" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
    <polygon points="212,17 209,14 208,19" fill="#1E1340" opacity="0.25"/>

    <!-- Text -->
    <rect x="222" y="5" width="32" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <text x="238" y="26" class="font-urban" fill="#1E1340" font-size="12" font-weight="700" opacity="0.3" text-anchor="middle">T</text>

    <!-- Separator -->
    <line x1="260" y1="10" x2="260" y2="32" stroke="#7C5CFC" stroke-width="0.5" opacity="0.08"/>

    <!-- Undo -->
    <rect x="266" y="5" width="32" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <path d="M 276 21 C 278 15, 286 13, 290 19" fill="none" stroke="#1E1340" stroke-width="1" opacity="0.3"/>
    <polygon points="276,21 273,18 274,24" fill="#1E1340" opacity="0.25"/>

    <!-- Redo -->
    <rect x="300" y="5" width="32" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <path d="M 324 21 C 322 15, 314 13, 310 19" fill="none" stroke="#1E1340" stroke-width="1" opacity="0.3"/>
    <polygon points="324,21 327,18 326,24" fill="#1E1340" opacity="0.25"/>

    <!-- Eraser -->
    <rect x="334" y="5" width="28" height="32" rx="8" fill="#7C5CFC" opacity="0.04"/>
    <rect x="341" y="13" width="10" height="14" rx="2" fill="none" stroke="#1E1340" stroke-width="1" opacity="0.3" transform="rotate(-15, 346, 20)"/>
  </g>

  <!-- COURT — Full width mobile -->
  <g transform="translate(8, 110)" filter="url(#courtShadow)">
    <rect width="374" height="720" rx="14" fill="#ffffff"/>
    <rect x="6" y="6" width="362" height="708" rx="10" fill="url(#courtGrad)"/>

    <!-- Court lines -->
    <line x1="187" y1="6" x2="187" y2="714" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
    <circle cx="187" cy="360" r="32" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>

    <!-- Left goal area -->
    <path d="M 6 230 Q 80 360 6 490" fill="#C8850A" opacity="0.4"/>
    <path d="M 6 230 Q 80 360 6 490" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 6 200 Q 105 360 6 520" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.3" stroke-dasharray="6,4"/>
    <rect x="4" y="340" width="5" height="40" fill="#fff" opacity="0.7"/>

    <!-- Right goal area -->
    <path d="M 368 230 Q 294 360 368 490" fill="#C8850A" opacity="0.4"/>
    <path d="M 368 230 Q 294 360 368 490" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <path d="M 368 200 Q 269 360 368 520" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.3" stroke-dasharray="6,4"/>
    <rect x="365" y="340" width="5" height="40" fill="#fff" opacity="0.7"/>

    <!-- Substitution marks -->
    <line x1="167" y1="6" x2="167" y2="18" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <line x1="207" y1="6" x2="207" y2="18" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <line x1="167" y1="702" x2="167" y2="714" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <line x1="207" y1="702" x2="207" y2="714" stroke="#fff" stroke-width="1" opacity="0.3"/>

    <!-- RED TEAM (coral) -->
    <circle cx="100" cy="230" r="14" fill="#F06850" stroke="#ffffff" stroke-width="2"/>
    <text x="100" y="235" class="font-urban" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">1</text>

    <circle cx="85" cy="320" r="14" fill="#F06850" stroke="#ffffff" stroke-width="2"/>
    <text x="85" y="325" class="font-urban" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">2</text>

    <circle cx="100" cy="410" r="14" fill="#F06850" stroke="#ffffff" stroke-width="2"/>
    <text x="100" y="415" class="font-urban" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">3</text>

    <circle cx="85" cy="490" r="14" fill="#F06850" stroke="#ffffff" stroke-width="2"/>
    <text x="85" y="495" class="font-urban" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">4</text>

    <circle cx="130" cy="280" r="14" fill="#F06850" stroke="#ffffff" stroke-width="2"/>
    <text x="130" y="285" class="font-urban" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">5</text>

    <circle cx="130" cy="430" r="14" fill="#F06850" stroke="#ffffff" stroke-width="2"/>
    <text x="130" y="435" class="font-urban" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">6</text>

    <!-- YELLOW TEAM -->
    <circle cx="260" cy="250" r="14" fill="#FFCA28" stroke="#ffffff" stroke-width="2"/>
    <text x="260" y="255" class="font-urban" fill="#1E1340" font-size="10" font-weight="800" text-anchor="middle">1</text>

    <circle cx="250" cy="340" r="14" fill="#FFCA28" stroke="#ffffff" stroke-width="2"/>
    <text x="250" y="345" class="font-urban" fill="#1E1340" font-size="10" font-weight="800" text-anchor="middle">2</text>

    <circle cx="260" cy="430" r="14" fill="#FFCA28" stroke="#ffffff" stroke-width="2"/>
    <text x="260" y="435" class="font-urban" fill="#1E1340" font-size="10" font-weight="800" text-anchor="middle">3</text>

    <circle cx="250" cy="500" r="14" fill="#FFCA28" stroke="#ffffff" stroke-width="2"/>
    <text x="250" y="505" class="font-urban" fill="#1E1340" font-size="10" font-weight="800" text-anchor="middle">4</text>

    <circle cx="280" cy="370" r="14" fill="#FFCA28" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="375" class="font-urban" fill="#1E1340" font-size="10" font-weight="800" text-anchor="middle">5</text>

    <!-- GOALKEEPERS -->
    <circle cx="28" cy="360" r="14" fill="#9C27B0" stroke="#ffffff" stroke-width="2"/>
    <text x="28" y="365" class="font-urban" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">G</text>

    <circle cx="346" cy="360" r="14" fill="#9C27B0" stroke="#ffffff" stroke-width="2"/>
    <text x="346" y="365" class="font-urban" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">G</text>

    <!-- BALLS -->
    <circle cx="145" cy="310" r="8" fill="#BCFF00" stroke="#ffffff" stroke-width="2"/>
    <circle cx="160" cy="460" r="8" fill="#BCFF00" stroke="#ffffff" stroke-width="2"/>

    <!-- CONES -->
    <polygon points="155,240 150,254 160,254" fill="#F06850" opacity="0.8"/>
    <polygon points="155,470 150,484 160,484" fill="#F06850" opacity="0.8"/>
    <polygon points="180,300 175,314 185,314" fill="#F06850" opacity="0.8"/>
    <polygon points="180,420 175,434 185,434" fill="#F06850" opacity="0.8"/>

    <!-- TRAJECTORIES -->
    <path d="M 130 280 L 145 310" stroke="#F06850" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.45"/>
    <path d="M 100 230 C 130 210, 150 230, 155 250" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.35"/>
    <path d="M 145 310 C 160 295, 170 300, 180 300" stroke="#22C55E" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    <path d="M 130 430 C 140 450, 155 455, 158 458" stroke="#F06850" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.45"/>
    <path d="M 250 340 L 230 355" stroke="#FFCA28" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.35"/>
    <path d="M 85 320 C 100 300, 120 285, 130 280" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.3"/>
  </g>
</svg>
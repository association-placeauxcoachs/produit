    <text x="12" y="145" class="font-urban" fill="#1E1340" font-size="14" font-weight="700">lors d'opposition</text>
    <rect x="12" y="158" width="50" height="18" rx="9" fill="#F5EEFF"/>
    <text x="37" y="170" class="font-inter" fill="#7C5CFC" font-size="9" font-weight="600" text-anchor="middle">Seniors</text>
    <rect x="68" y="158" width="52" height="18" rx="9" fill="#FFF0EC"/>
    <text x="94" y="170" class="font-inter" fill="#F06850" font-size="9" font-weight="600" text-anchor="middle">Défense</text>
    <text x="12" y="200" class="font-inter" fill="#1E1340" font-size="10" opacity="0.25">10 mars 2026</text>
    <rect x="268" y="186" width="76" height="22" rx="11" fill="#FFF0EC"/>
    <circle cx="283" cy="197" r="3" fill="#F06850"/>
    <text x="306" y="201" class="font-inter" fill="#F06850" font-size="9" font-weight="600">En cours</text>
  </g>


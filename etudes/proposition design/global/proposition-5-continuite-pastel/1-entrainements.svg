<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .font-urban { font-family: 'Urbanist', sans-serif; }
      .font-inter { font-family: 'Inter', sans-serif; }
    </style>
    <linearGradient id="bgPastel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F8F5FF"/>
      <stop offset="50%" stop-color="#FFF8F5"/>
      <stop offset="100%" stop-color="#F3F0FF"/>
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEFCFF"/>
      <stop offset="100%" stop-color="#F9F5FF"/>
    </linearGradient>
    <linearGradient id="ctaViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#7C5CFC"/>
    </linearGradient>
    <linearGradient id="courtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <radialGradient id="blobViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C5B3FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C5B3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPeach" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD4B8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFD4B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7C5CFC" flood-opacity="0.05"/>
    </filter>
    <filter id="cardHover">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#7C5CFC" flood-opacity="0.09"/>
    </filter>
    <filter id="btnShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#7C5CFC" flood-opacity="0.2"/>
    </filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <!-- BG with pastel gradient (coherent with landing) -->
  <rect width="1440" height="900" fill="url(#bgPastel)"/>
  <!-- Subtle blobs on internal pages too -->
  <ellipse cx="800" cy="200" rx="250" ry="180" fill="url(#blobViolet)" filter="url(#softGlow)"/>
  <ellipse cx="1300" cy="650" rx="200" ry="150" fill="url(#blobPeach)" filter="url(#softGlow)"/>

  <!-- SIDEBAR -->
  <rect width="250" height="900" fill="url(#sidebarGrad)"/>
  <line x1="250" y1="0" x2="250" y2="900" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>

  <!-- Logo -->
  <circle cx="40" cy="34" r="13" fill="#7C5CFC" opacity="0.12"/>
  <circle cx="40" cy="34" r="6" fill="#7C5CFC" opacity="0.3"/>
  <circle cx="40" cy="34" r="3" fill="#7C5CFC"/>
  <text x="62" y="40" class="font-urban" fill="#1E1340" font-size="15" font-weight="800">Place aux coachs</text>
  <line x1="20" y1="64" x2="230" y2="64" stroke="#7C5CFC" stroke-width="0.5" opacity="0.05"/>

  <!-- Active nav -->
  <rect x="12" y="80" width="226" height="42" rx="12" fill="#7C5CFC" opacity="0.06"/>
  <rect x="12" y="80" width="4" height="42" rx="2" fill="#F06850"/>
  <text x="50" y="107" class="font-urban" fill="#F06850" font-size="14" font-weight="700">Entraînements</text>

  <text x="50" y="148" class="font-urban" fill="#1E1340" font-size="14" font-weight="500" opacity="0.35">Communauté</text>

  <text x="24" y="200" class="font-urban" fill="#1E1340" font-size="10" font-weight="700" opacity="0.2" letter-spacing="1.5">GROUPES DE TRAVAIL</text>
  <text x="50" y="228" class="font-inter" fill="#1E1340" font-size="13" opacity="0.4">Mon club HB</text>
  <circle cx="215" cy="223" r="4" fill="#F06850" opacity="0.5"/>
  <text x="50" y="254" class="font-inter" fill="#1E1340" font-size="13" opacity="0.3">Formation U15</text>

  <!-- User -->
  <g transform="translate(0, 760)">
    <line x1="20" y1="0" x2="230" y2="0" stroke="#7C5CFC" stroke-width="0.5" opacity="0.05"/>
    <circle cx="42" cy="48" r="19" fill="#F5EEFF" stroke="#7C5CFC" stroke-width="1" stroke-opacity="0.15"/>
    <text x="42" y="54" class="font-urban" fill="#7C5CFC" font-size="12" font-weight="700" text-anchor="middle">PR</text>
    <text x="72" y="44" class="font-urban" fill="#1E1340" font-size="13" font-weight="700">Preview</text>
    <text x="72" y="60" class="font-inter" fill="#1E1340" font-size="10" opacity="0.3">preview@placeauxcoachs.fr</text>
    <text x="50" y="98" class="font-inter" fill="#1E1340" font-size="12" opacity="0.3">Profil</text>
    <text x="50" y="118" class="font-inter" fill="#1E1340" font-size="12" opacity="0.3">Déconnexion</text>
  </g>

  <!-- TOP BAR -->
  <rect x="250" y="0" width="1190" height="68" fill="#ffffff" opacity="0.6"/>
  <line x1="250" y1="68" x2="1440" y2="68" stroke="#7C5CFC" stroke-width="0.5" opacity="0.05"/>

  <!-- Search -->
  <rect x="290" y="15" width="440" height="40" rx="20" fill="#ffffff" stroke="#7C5CFC" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="314" cy="35" r="7" fill="none" stroke="#1E1340" stroke-width="1.3" opacity="0.2"/>
  <line x1="319" y1="40" x2="323" y2="44" stroke="#1E1340" stroke-width="1.3" opacity="0.2"/>
  <text x="338" y="40" class="font-inter" fill="#1E1340" font-size="13" opacity="0.22">Rechercher un entraînement...</text>

  <!-- Tabs (pill style) -->
  <rect x="790" y="19" width="135" height="32" rx="16" fill="#7C5CFC" opacity="0.08"/>
  <text x="858" y="40" class="font-urban" fill="#7C5CFC" font-size="12" font-weight="700" text-anchor="middle">Mes entraînements</text>
  <text x="970" y="40" class="font-urban" fill="#1E1340" font-size="12" font-weight="500" opacity="0.3" text-anchor="middle">Communauté</text>
  <text x="1065" y="40" class="font-urban" fill="#1E1340" font-size="12" font-weight="500" opacity="0.3" text-anchor="middle">Groupes</text>

  <!-- Create button (coral accent) -->
  <rect x="1295" y="15" width="105" height="40" rx="20" fill="url(#ctaViolet)" filter="url(#btnShadow)"/>
  <text x="1348" y="40" class="font-urban" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">+ Créer</text>

  <!-- === CARDS === -->
  <!-- Card 1 — Prêt (green) -->
  <g transform="translate(285, 90)" filter="url(#cardHover)">
    <rect width="365" height="235" rx="16" fill="#ffffff"/>
    <rect y="0" width="365" height="4" rx="2" fill="#22C55E"/>
    <rect x="15" y="18" width="335" height="95" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="113" stroke="#fff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="182" cy="65" r="12" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="130" cy="52" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="130" cy="78" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="235" cy="52" r="5" fill="#FFCA28" opacity="0.8"/>
    <circle cx="235" cy="78" r="5" fill="#FFCA28" opacity="0.8"/>
    <circle cx="160" cy="63" r="3" fill="#BCFF00"/>
    <text x="15" y="143" class="font-urban" fill="#1E1340" font-size="15" font-weight="700">Améliorer le jeu du PB dans l'exploitation</text>
    <rect x="15" y="157" width="40" height="20" rx="10" fill="#F5EEFF"/>
    <text x="35" y="171" class="font-inter" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U15</text>
    <rect x="62" y="157" width="60" height="20" rx="10" fill="#FFF0EC"/>
    <text x="92" y="171" class="font-inter" fill="#F06850" font-size="10" font-weight="600" text-anchor="middle">Attaque</text>
    <rect x="129" y="157" width="48" height="20" rx="10" fill="#EEF7FF"/>
    <text x="153" y="171" class="font-inter" fill="#5B8DEF" font-size="10" font-weight="600" text-anchor="middle">3 sit.</text>
    <text x="15" y="215" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25">12 mars 2026</text>
    <rect x="288" y="200" width="62" height="24" rx="12" fill="#ECFDF5"/>
    <circle cx="304" cy="212" r="3.5" fill="#22C55E"/>
    <text x="325" y="217" class="font-inter" fill="#16A34A" font-size="10" font-weight="600">Prêt</text>
  </g>

  <!-- Card 2 — En cours (coral) -->
  <g transform="translate(670, 90)" filter="url(#cardShadow)">
    <rect width="365" height="235" rx="16" fill="#ffffff"/>
    <rect y="0" width="365" height="4" rx="2" fill="#F06850"/>
    <rect x="15" y="18" width="335" height="95" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="113" stroke="#fff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="182" cy="65" r="12" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="140" cy="58" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="225" cy="72" r="5" fill="#FFCA28" opacity="0.8"/>
    <text x="15" y="143" class="font-urban" fill="#1E1340" font-size="15" font-weight="700">Entrainement du jeu de PB lors d'opposition</text>
    <rect x="15" y="157" width="55" height="20" rx="10" fill="#F5EEFF"/>
    <text x="42" y="171" class="font-inter" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">Seniors</text>
    <rect x="77" y="157" width="60" height="20" rx="10" fill="#FFF0EC"/>
    <text x="107" y="171" class="font-inter" fill="#F06850" font-size="10" font-weight="600" text-anchor="middle">Défense</text>
    <text x="15" y="215" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25">10 mars 2026</text>
    <rect x="275" y="200" width="76" height="24" rx="12" fill="#FFF0EC"/>
    <circle cx="293" cy="212" r="3.5" fill="#F06850"/>
    <text x="318" y="217" class="font-inter" fill="#F06850" font-size="10" font-weight="600">En cours</text>
  </g>

  <!-- Card 3 — Terminé (violet) -->
  <g transform="translate(1055, 90)" filter="url(#cardShadow)">
    <rect width="365" height="235" rx="16" fill="#ffffff"/>
    <rect y="0" width="365" height="4" rx="2" fill="#7C5CFC"/>
    <rect x="15" y="18" width="335" height="95" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="113" stroke="#fff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="182" cy="65" r="12" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="145" cy="55" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="145" cy="75" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="222" cy="65" r="5" fill="#FFCA28" opacity="0.8"/>
    <text x="15" y="143" class="font-urban" fill="#1E1340" font-size="15" font-weight="700">Initiation au jeu du PB lors l'opposition</text>
    <rect x="15" y="157" width="40" height="20" rx="10" fill="#F5EEFF"/>
    <text x="35" y="171" class="font-inter" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U13</text>
    <rect x="62" y="157" width="65" height="20" rx="10" fill="#EEF7FF"/>
    <text x="94" y="171" class="font-inter" fill="#5B8DEF" font-size="10" font-weight="600" text-anchor="middle">Initiation</text>
    <text x="15" y="215" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25">8 mars 2026</text>
    <rect x="280" y="200" width="70" height="24" rx="12" fill="#F5EEFF"/>
    <circle cx="298" cy="212" r="3.5" fill="#7C5CFC"/>
    <text x="322" y="217" class="font-inter" fill="#7C5CFC" font-size="10" font-weight="600">Terminé</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 4 — Brouillon (gray) -->
  <g transform="translate(285, 350)" filter="url(#cardShadow)">
    <rect width="365" height="235" rx="16" fill="#ffffff"/>
    <rect y="0" width="365" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="15" y="18" width="335" height="95" rx="10" fill="url(#courtGrad)" opacity="0.4"/>
    <text x="15" y="143" class="font-urban" fill="#1E1340" font-size="15" font-weight="700">Entraînement du PDE et son enchaînement</text>
    <rect x="15" y="157" width="40" height="20" rx="10" fill="#F5EEFF"/>
    <text x="35" y="171" class="font-inter" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U18</text>
    <text x="15" y="215" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25">5 mars 2026</text>
    <rect x="275" y="200" width="76" height="24" rx="12" fill="#F1F5F9"/>
    <circle cx="293" cy="212" r="3.5" fill="#94A3B8"/>
    <text x="318" y="217" class="font-inter" fill="#64748B" font-size="10" font-weight="600">Brouillon</text>
  </g>

  <!-- Card 5 — Prêt -->
  <g transform="translate(670, 350)" filter="url(#cardShadow)">
    <rect width="365" height="235" rx="16" fill="#ffffff"/>
    <rect y="0" width="365" height="4" rx="2" fill="#22C55E"/>
    <rect x="15" y="18" width="335" height="95" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="113" stroke="#fff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="130" cy="48" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="130" cy="65" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="130" cy="82" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="235" cy="55" r="5" fill="#FFCA28" opacity="0.8"/>
    <circle cx="235" cy="75" r="5" fill="#FFCA28" opacity="0.8"/>
    <text x="15" y="143" class="font-urban" fill="#1E1340" font-size="15" font-weight="700">Exploitation du surnombre en attaque</text>
    <rect x="15" y="157" width="55" height="20" rx="10" fill="#F5EEFF"/>
    <text x="42" y="171" class="font-inter" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">Seniors</text>
    <rect x="77" y="157" width="80" height="20" rx="10" fill="#FFF0EC"/>
    <text x="117" y="171" class="font-inter" fill="#F06850" font-size="10" font-weight="600" text-anchor="middle">Surnombre</text>
    <text x="15" y="215" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25">3 mars 2026</text>
    <rect x="288" y="200" width="62" height="24" rx="12" fill="#ECFDF5"/>
    <circle cx="304" cy="212" r="3.5" fill="#22C55E"/>
    <text x="325" y="217" class="font-inter" fill="#16A34A" font-size="10" font-weight="600">Prêt</text>
  </g>

  <!-- Card 6 — En cours -->
  <g transform="translate(1055, 350)" filter="url(#cardShadow)">
    <rect width="365" height="235" rx="16" fill="#ffffff"/>
    <rect y="0" width="365" height="4" rx="2" fill="#F06850"/>
    <rect x="15" y="18" width="335" height="95" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="113" stroke="#fff" stroke-width="0.7" opacity="0.3"/>
    <circle cx="120" cy="58" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="120" cy="78" r="5" fill="#F06850" opacity="0.8"/>
    <circle cx="240" cy="65" r="5" fill="#FFCA28" opacity="0.8"/>
    <text x="15" y="143" class="font-urban" fill="#1E1340" font-size="15" font-weight="700">Améliorer le comportement du PB face</text>
    <rect x="15" y="157" width="40" height="20" rx="10" fill="#F5EEFF"/>
    <text x="35" y="171" class="font-inter" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U15</text>
    <text x="15" y="215" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25">1 mars 2026</text>
    <rect x="275" y="200" width="76" height="24" rx="12" fill="#FFF0EC"/>
    <circle cx="293" cy="212" r="3.5" fill="#F06850"/>
    <text x="318" y="217" class="font-inter" fill="#F06850" font-size="10" font-weight="600">En cours</text>
  </g>

  <!-- Row 3 partial -->
  <g transform="translate(285, 610)" filter="url(#cardShadow)">
    <rect width="365" height="235" rx="16" fill="#ffffff"/>
    <rect y="0" width="365" height="4" rx="2" fill="#22C55E"/>
    <rect x="15" y="18" width="335" height="95" rx="10" fill="url(#courtGrad)"/>
    <text x="15" y="143" class="font-urban" fill="#1E1340" font-size="15" font-weight="700">Jeu en supériorité</text>
    <text x="15" y="215" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25">28 fév 2026</text>
    <rect x="288" y="200" width="62" height="24" rx="12" fill="#ECFDF5"/>
    <circle cx="304" cy="212" r="3.5" fill="#22C55E"/>
    <text x="325" y="217" class="font-inter" fill="#16A34A" font-size="10" font-weight="600">Prêt</text>
  </g>

  <g transform="translate(670, 610)" filter="url(#cardShadow)">
    <rect width="365" height="235" rx="16" fill="#ffffff"/>
    <rect y="0" width="365" height="4" rx="2" fill="#7C5CFC"/>
    <rect x="15" y="18" width="335" height="95" rx="10" fill="url(#courtGrad)"/>
    <text x="15" y="143" class="font-urban" fill="#1E1340" font-size="15" font-weight="700">Améliorer le jeu du TAR lors l'opposition</text>
    <text x="15" y="215" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25">25 fév 2026</text>
    <rect x="280" y="200" width="70" height="24" rx="12" fill="#F5EEFF"/>
    <circle cx="298" cy="212" r="3.5" fill="#7C5CFC"/>
    <text x="322" y="217" class="font-inter" fill="#7C5CFC" font-size="10" font-weight="600">Terminé</text>
  </g>

  <!-- Pagination -->
  <g transform="translate(750, 878)">
    <text x="-60" y="0" class="font-inter" fill="#1E1340" font-size="11" opacity="0.2">← Précédent</text>
    <rect x="40" y="-12" width="26" height="22" rx="11" fill="#7C5CFC" opacity="0.08"/>
    <text x="53" y="3" class="font-inter" fill="#7C5CFC" font-size="11" font-weight="600" text-anchor="middle">1</text>
    <text x="82" y="3" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25" text-anchor="middle">2</text>
    <text x="110" y="3" class="font-inter" fill="#1E1340" font-size="11" opacity="0.25" text-anchor="middle">3</text>
    <text x="150" y="0" class="font-inter" fill="#1E1340" font-size="11" opacity="0.2">Suivant →</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <filter id="chalkDust" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="linear" slope="0.08" intercept="0"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="screen"/>
    </filter>
    <filter id="chalkLine" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="chalkDots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.3" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B3D2F"/>
      <stop offset="50%" stop-color="#1E4434"/>
      <stop offset="100%" stop-color="#1A3B2D"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4226"/>
      <stop offset="50%" stop-color="#4A2E14"/>
      <stop offset="100%" stop-color="#3D2510"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&amp;family=Patrick+Hand&amp;display=swap');
      .font-chalk { font-family: 'Caveat', cursive; }
      .font-hand { font-family: 'Patrick Hand', cursive; }
    </style>
  </defs>

  <!-- CHALKBOARD BACKGROUND -->
  <rect width="1440" height="900" fill="url(#boardGrad)"/>
  <rect width="1440" height="900" fill="url(#chalkDots)"/>

  <!-- Wood frame -->
  <rect width="1440" height="8" fill="url(#woodGrad)"/>
  <rect y="892" width="1440" height="8" fill="url(#woodGrad)"/>
  <rect width="8" height="900" fill="url(#woodGrad)"/>
  <rect x="1432" width="8" height="900" fill="url(#woodGrad)"/>

  <!-- MINIMAL SIDEBAR -->
  <rect x="8" y="8" width="56" height="884" fill="#162E24" opacity="0.6"/>
  <line x1="64" y1="8" x2="64" y2="892" stroke="#F5F0E8" stroke-width="0.5" opacity="0.08"/>
  <circle cx="36" cy="36" r="12" fill="none" stroke="#FFD93D" stroke-width="1.5" opacity="0.5"/>
  <circle cx="36" cy="36" r="4" fill="#FFD93D" opacity="0.4"/>
  <text x="36" y="82" class="font-chalk" fill="#F5F0E8" font-size="18" text-anchor="middle" opacity="0.3">⌂</text>
  <text x="36" y="116" class="font-chalk" fill="#F5F0E8" font-size="18" text-anchor="middle" opacity="0.3">📋</text>
  <circle cx="36" cy="830" r="14" fill="none" stroke="#FF6B6B" stroke-width="1.5" opacity="0.3"/>
  <text x="36" y="836" class="font-chalk" fill="#FF6B6B" font-size="12" text-anchor="middle" opacity="0.5">PR</text>

  <!-- TOOLBAR (Wooden ruler style) -->
  <rect x="64" y="8" width="1368" height="52" fill="#3D2510" opacity="0.8"/>
  <rect x="64" y="58" width="1368" height="2" fill="#5D3A1A"/>
  <line x1="64" y1="20" x2="1432" y2="20" stroke="#4A2E14" stroke-width="0.5" opacity="0.3"/>
  <line x1="64" y1="40" x2="1432" y2="40" stroke="#4A2E14" stroke-width="0.5" opacity="0.2"/>

  <!-- Back -->
  <text x="90" y="40" class="font-chalk" fill="#F5F0E8" font-size="22" opacity="0.5">‹</text>
  <line x1="118" y1="18" x2="118" y2="50" stroke="#F5F0E8" stroke-width="0.5" opacity="0.1"/>

  <!-- Tools -->
  <g transform="translate(135, 16)">
    <rect width="34" height="30" rx="4" fill="#F5F0E8" opacity="0.06"/>
    <rect x="8" y="6" width="18" height="7" rx="1" fill="none" stroke="#F5F0E8" stroke-width="1.5" opacity="0.35"/>
    <rect x="8" y="17" width="18" height="7" rx="1" fill="none" stroke="#F5F0E8" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Cursor Active -->
  <g transform="translate(180, 16)">
    <circle cx="17" cy="15" r="17" fill="#FFD93D" opacity="0.12" stroke="#FFD93D" stroke-width="2" stroke-opacity="0.4"/>
    <text x="17" y="21" class="font-chalk" fill="#FFD93D" font-size="18" text-anchor="middle">↖</text>
  </g>
  <!-- Player -->
  <g transform="translate(225, 16)">
    <rect width="34" height="30" rx="4" fill="#F5F0E8" opacity="0.06"/>
    <circle cx="17" cy="11" r="5" fill="none" stroke="#F5F0E8" stroke-width="1.5" opacity="0.35"/>
    <line x1="17" y1="16" x2="17" y2="26" stroke="#F5F0E8" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Cone -->
  <g transform="translate(270, 16)">
    <rect width="34" height="30" rx="4" fill="#F5F0E8" opacity="0.06"/>
    <polygon points="17,6 8,26 26,26" fill="none" stroke="#F5F0E8" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Trajectory -->
  <g transform="translate(315, 16)">
    <rect width="34" height="30" rx="4" fill="#F5F0E8" opacity="0.06"/>
    <path d="M 8 22 Q 17 6 26 22" fill="none" stroke="#F5F0E8" stroke-width="1.5" opacity="0.35"/>
  </g>
  <line x1="362" y1="18" x2="362" y2="50" stroke="#F5F0E8" stroke-width="0.5" opacity="0.1"/>
  <!-- Undo/Redo -->
  <g transform="translate(375, 16)">
    <rect width="34" height="30" rx="4" fill="#F5F0E8" opacity="0.06"/>
    <text x="17" y="22" class="font-chalk" fill="#F5F0E8" font-size="16" text-anchor="middle" opacity="0.35">↩</text>
  </g>
  <g transform="translate(418, 16)">
    <rect width="34" height="30" rx="4" fill="#F5F0E8" opacity="0.06"/>
    <text x="17" y="22" class="font-chalk" fill="#F5F0E8" font-size="16" text-anchor="middle" opacity="0.35">↪</text>
  </g>
  <line x1="465" y1="18" x2="465" y2="50" stroke="#F5F0E8" stroke-width="0.5" opacity="0.1"/>
  <!-- Eraser -->
  <g transform="translate(478, 16)">
    <rect width="34" height="30" rx="4" fill="#F5F0E8" opacity="0.06"/>
    <rect x="8" y="10" width="18" height="12" rx="2" fill="none" stroke="#F5F0E8" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- Right buttons -->
  <rect x="1220" y="16" width="90" height="32" rx="3" fill="none" stroke="#F5F0E8" stroke-width="1.5" opacity="0.2" stroke-dasharray="5,3"/>
  <text x="1265" y="37" class="font-chalk" fill="#F5F0E8" font-size="16" text-anchor="middle" opacity="0.5">← Retour</text>
  <rect x="1325" y="16" width="95" height="32" rx="3" fill="#FFD93D" opacity="0.12" stroke="#FFD93D" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="1373" y="37" class="font-chalk" fill="#FFD93D" font-size="16" font-weight="600" text-anchor="middle">Sauver ✓</text>

  <!-- HANDBALL COURT (chalk on chalkboard) -->
  <g transform="translate(100, 85)" filter="url(#chalkDust)">
    <!-- Court outline -->
    <rect width="1280" height="700" rx="4" fill="none" stroke="#F5F0E8" stroke-width="3" opacity="0.5" filter="url(#chalkLine)"/>
    <!-- Center line -->
    <line x1="640" y1="0" x2="640" y2="700" stroke="#F5F0E8" stroke-width="2.5" opacity="0.4" filter="url(#chalkLine)"/>
    <!-- Center circle -->
    <circle cx="640" cy="350" r="60" fill="none" stroke="#F5F0E8" stroke-width="2.5" opacity="0.4" filter="url(#chalkLine)"/>

    <!-- LEFT GOAL AREA -->
    <rect x="-4" y="290" width="10" height="120" rx="2" fill="#F5F0E8" opacity="0.6" filter="url(#chalkLine)"/>
    <path d="M 0 225 Q 155 350 0 475" fill="none" stroke="#F5F0E8" stroke-width="2.5" opacity="0.5" filter="url(#chalkLine)"/>
    <path d="M 0 175 Q 210 350 0 525" fill="none" stroke="#F5F0E8" stroke-width="2" opacity="0.3" stroke-dasharray="12,8" filter="url(#chalkLine)"/>

    <!-- RIGHT GOAL AREA -->
    <rect x="1274" y="290" width="10" height="120" rx="2" fill="#F5F0E8" opacity="0.6" filter="url(#chalkLine)"/>
    <path d="M 1280 225 Q 1125 350 1280 475" fill="none" stroke="#F5F0E8" stroke-width="2.5" opacity="0.5" filter="url(#chalkLine)"/>
    <path d="M 1280 175 Q 1070 350 1280 525" fill="none" stroke="#F5F0E8" stroke-width="2" opacity="0.3" stroke-dasharray="12,8" filter="url(#chalkLine)"/>

    <!-- RED TEAM - Coral chalk X shapes -->
    <g transform="translate(370, 190)" filter="url(#chalkLine)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(370, 350)" filter="url(#chalkLine)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(370, 500)" filter="url(#chalkLine)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(440, 270)" filter="url(#chalkLine)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(440, 430)" filter="url(#chalkLine)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(280, 100)" filter="url(#chalkLine)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
    <g transform="translate(280, 600)" filter="url(#chalkLine)">
      <line x1="-14" y1="-14" x2="14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
      <line x1="14" y1="-14" x2="-14" y2="14" stroke="#FF6B6B" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>

    <!-- YELLOW TEAM - Yellow chalk O shapes -->
    <circle cx="880" cy="230" r="16" fill="none" stroke="#FFD93D" stroke-width="4" opacity="0.8" filter="url(#chalkLine)"/>
    <circle cx="880" cy="470" r="16" fill="none" stroke="#FFD93D" stroke-width="4" opacity="0.8" filter="url(#chalkLine)"/>
    <circle cx="940" cy="350" r="16" fill="none" stroke="#FFD93D" stroke-width="4" opacity="0.8" filter="url(#chalkLine)"/>
    <circle cx="830" cy="150" r="16" fill="none" stroke="#FFD93D" stroke-width="4" opacity="0.8" filter="url(#chalkLine)"/>
    <circle cx="830" cy="550" r="16" fill="none" stroke="#FFD93D" stroke-width="4" opacity="0.8" filter="url(#chalkLine)"/>

    <!-- GOALKEEPERS -->
    <g transform="translate(80, 350)" filter="url(#chalkLine)">
      <circle r="18" fill="#9C6ADE" opacity="0.5"/>
      <circle r="18" fill="none" stroke="#9C6ADE" stroke-width="3" opacity="0.7"/>
      <text y="5" class="font-chalk" fill="#F5F0E8" font-size="14" text-anchor="middle">GB</text>
    </g>
    <g transform="translate(1200, 350)" filter="url(#chalkLine)">
      <circle r="18" fill="#9C6ADE" opacity="0.5"/>
      <circle r="18" fill="none" stroke="#9C6ADE" stroke-width="3" opacity="0.7"/>
      <text y="5" class="font-chalk" fill="#F5F0E8" font-size="14" text-anchor="middle">GB</text>
    </g>

    <!-- BALL -->
    <circle cx="480" cy="310" r="9" fill="#F5F0E8" opacity="0.7" filter="url(#chalkLine)"/>

    <!-- TRAJECTORIES -->
    <path d="M 490 310 C 520 290 550 270 580 260" fill="none" stroke="#6BC5F8" stroke-width="2.5" stroke-dasharray="10,6" opacity="0.5" filter="url(#chalkLine)"/>
    <polygon points="578,255 586,258 580,266" fill="#6BC5F8" opacity="0.5"/>
    <path d="M 370 350 C 420 330 470 310 510 300" fill="none" stroke="#FFD93D" stroke-width="2" stroke-dasharray="8,5" opacity="0.4" filter="url(#chalkLine)"/>
    <polygon points="508,295 516,298 510,306" fill="#FFD93D" opacity="0.4"/>
    <path d="M 370 500 C 400 480 450 470 500 465" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="8,5" opacity="0.35" filter="url(#chalkLine)"/>
    <polygon points="498,460 506,463 500,470" fill="#FF6B6B" opacity="0.35"/>

    <!-- CONES -->
    <polygon points="560,245 550,265 570,265" fill="none" stroke="#FF6B6B" stroke-width="2.5" opacity="0.6" filter="url(#chalkLine)"/>
    <polygon points="560,445 550,465 570,465" fill="none" stroke="#FF6B6B" stroke-width="2.5" opacity="0.6" filter="url(#chalkLine)"/>

    <!-- Chalk annotations -->
    <text x="1100" y="80" class="font-chalk" fill="#F5F0E8" font-size="14" opacity="0.15" transform="rotate(-5, 1100, 80)">attaque →</text>
    <text x="100" y="80" class="font-chalk" fill="#F5F0E8" font-size="14" opacity="0.15" transform="rotate(3, 100, 80)">← défense</text>
  </g>

  <!-- Chalk dust -->
  <circle cx="1350" cy="150" r="40" fill="#F5F0E8" opacity="0.008"/>
  <circle cx="120" cy="800" r="50" fill="#F5F0E8" opacity="0.006"/>
</svg>

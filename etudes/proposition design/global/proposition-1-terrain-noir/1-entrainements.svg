    <rect width="360" height="3" rx="2" fill="#00D4FF"/>
    <rect x="15" y="18" width="330" height="110" rx="6" fill="url(#courtGrad)"/>
    <line x1="180" y1="18" x2="180" y2="128" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="180" cy="73" r="15" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="140" cy="65" r="5" fill="#FF3D71" opacity="0.8"/>
    <circle cx="140" cy="80" r="5" fill="#FF3D71" opacity="0.8"/>
    <circle cx="220" cy="65" r="5" fill="#FFEB3B" opacity="0.8"/>
    <text x="15" y="155" class="font-oswald" fill="#ffffff" font-size="16" font-weight="600" letter-spacing="0.5">Initiation à jeu du PB lors l'opposition en</text>
    <rect x="15" y="170" width="48" height="20" rx="3" fill="#00D4FF" opacity="0.12"/>
    <text x="39" y="184" class="font-inter" fill="#00D4FF" font-size="10" text-anchor="middle">U13</text>
    <rect x="70" y="170" width="75" height="20" rx="3" fill="#7B61FF" opacity="0.12"/>
    <text x="108" y="184" class="font-inter" fill="#7B61FF" font-size="10" text-anchor="middle">Initiation</text>
    <text x="15" y="220" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">8 mars 2026</text>
    <rect x="268" y="203" width="72" height="22" rx="4" fill="#00D4FF" opacity="0.15"/>
    <text x="304" y="218" class="font-inter" fill="#00D4FF" font-size="10" font-weight="500" text-anchor="middle">Terminé</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 4 -->

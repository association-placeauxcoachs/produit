    <circle cx="130" cy="90" r="5" fill="#FF3D71" opacity="0.8"/>
    <circle cx="250" cy="60" r="5" fill="#FFEB3B" opacity="0.8"/>
    <circle cx="250" cy="85" r="5" fill="#FFEB3B" opacity="0.8"/>

    <text x="45" y="184" class="font-inter" fill="#00D4FF" font-size="10" text-anchor="middle">Seniors</text>
    <rect x="82" y="170" width="70" height="20" rx="3" fill="#FF6B35" opacity="0.12"/>
    <text x="117" y="184" class="font-inter" fill="#FF6B35" font-size="10" text-anchor="middle">Défense</text>
    <text x="15" y="220" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">10 mars 2026</text>
    <rect x="270" y="203" width="72" height="22" rx="4" fill="#FF6B35" opacity="0.15"/>
    <text x="306" y="218" class="font-inter" fill="#FF6B35" font-size="10" font-weight="500" text-anchor="middle">En cours</text>
  </g>


    <text x="39" y="184" class="font-inter" fill="#00D4FF" font-size="10" text-anchor="middle">U18</text>
    <text x="15" y="220" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">5 mars 2026</text>
    <rect x="268" y="203" width="72" height="22" rx="4" fill="#ffffff" opacity="0.06"/>
    <text x="304" y="218" class="font-inter" fill="#ffffff" font-size="10" font-weight="500" text-anchor="middle" opacity="0.35">Brouillon</text>
  </g>

  <!-- Card 5 -->

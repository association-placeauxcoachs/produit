    <rect width="360" height="240" rx="10" fill="#ffffff" opacity="0.03" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    <rect width="360" height="3" rx="2" fill="#BCFF00"/>
    <rect x="15" y="18" width="330" height="110" rx="6" fill="url(#courtGrad)"/>
    <line x1="180" y1="18" x2="180" y2="128" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="180" cy="73" r="15" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="120" cy="50" r="5" fill="#FF3D71" opacity="0.8"/>
    <circle cx="120" cy="73" r="5" fill="#FF3D71" opacity="0.8"/>
    <circle cx="120" cy="95" r="5" fill="#FF3D71" opacity="0.8"/>
    <circle cx="240" cy="60" r="5" fill="#FFEB3B" opacity="0.8"/>
    <circle cx="240" cy="85" r="5" fill="#FFEB3B" opacity="0.8"/>

    <text x="39" y="184" class="font-inter" fill="#00D4FF" font-size="10" text-anchor="middle">U15</text>
    <rect x="70" y="170" width="70" height="20" rx="3" fill="#FF6B35" opacity="0.12"/>
    <text x="105" y="184" class="font-inter" fill="#FF6B35" font-size="10" text-anchor="middle">Attaque</text>
    <rect x="148" y="170" width="58" height="20" rx="3" fill="#BCFF00" opacity="0.1"/>
    <text x="177" y="184" class="font-inter" fill="#BCFF00" font-size="10" text-anchor="middle">3 sit.</text>
    <!-- Bottom info -->

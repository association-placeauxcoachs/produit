    <rect x="280" y="203" width="60" height="22" rx="4" fill="#BCFF00" opacity="0.15"/>
    <text x="310" y="218" class="font-inter" fill="#BCFF00" font-size="10" font-weight="500" text-anchor="middle">Prêt</text>

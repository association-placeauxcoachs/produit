<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1600" width="1440" height="1600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .font-oswald { font-family: 'Oswald', sans-serif; }
      .font-inter { font-family: 'Inter', sans-serif; }
    </style>
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00D4FF" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF6B35" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0E18"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08080D"/>
      <stop offset="100%" stop-color="#0A0A12"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF3D71"/>
    </linearGradient>
    <linearGradient id="courtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1600" fill="url(#bgGrad)"/>
  <rect width="1440" height="1600" fill="url(#grid)"/>

  <!-- === SIDEBAR === -->
  <rect width="240" height="1600" fill="url(#sideGrad)"/>
  <line x1="240" y1="0" x2="240" y2="1600" stroke="#ffffff" stroke-width="1" opacity="0.05"/>

  <!-- Logo -->
  <circle cx="40" cy="36" r="14" fill="none" stroke="#00D4FF" stroke-width="1.5" opacity="0.7"/>
  <circle cx="40" cy="36" r="5" fill="#FF6B35"/>
  <text x="62" y="42" class="font-oswald" fill="#ffffff" font-size="14" font-weight="600" letter-spacing="1.5">PLACE AUX COACHS</text>

  <line x1="20" y1="72" x2="220" y2="72" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>

  <!-- Situations list title -->
  <text x="24" y="100" class="font-oswald" fill="#ffffff" font-size="13" font-weight="600" letter-spacing="1.5" opacity="0.4">SITUATIONS</text>

  <!-- Situation 1 - Active -->
  <rect x="12" y="115" width="216" height="60" rx="6" fill="#00D4FF" opacity="0.08"/>
  <rect x="12" y="115" width="3" height="60" rx="2" fill="#00D4FF"/>
  <text x="28" y="137" class="font-oswald" fill="#00D4FF" font-size="11" font-weight="600" letter-spacing="0.5">01</text>
  <text x="50" y="137" class="font-inter" fill="#ffffff" font-size="12" font-weight="500">Échauffement, mise en train</text>
  <text x="50" y="155" class="font-inter" fill="#ffffff" font-size="10" opacity="0.35">3 schémas · 8 éléments</text>

  <!-- Situation 2 -->
  <rect x="12" y="185" width="216" height="60" rx="6" fill="transparent"/>
  <text x="28" y="207" class="font-oswald" fill="#ffffff" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.3">02</text>
  <text x="50" y="207" class="font-inter" fill="#ffffff" font-size="12" font-weight="400" opacity="0.5">Travail du duel 1v1 / Tirer</text>
  <text x="50" y="225" class="font-inter" fill="#ffffff" font-size="10" opacity="0.25">2 schémas · 12 éléments</text>

  <!-- Situation 3 -->
  <rect x="12" y="255" width="216" height="60" rx="6" fill="transparent"/>
  <text x="28" y="277" class="font-oswald" fill="#ffffff" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.3">03</text>
  <text x="50" y="277" class="font-inter" fill="#ffffff" font-size="12" font-weight="400" opacity="0.5">Situation en phase travail</text>
  <text x="50" y="295" class="font-inter" fill="#ffffff" font-size="10" opacity="0.25">1 schéma · 6 éléments</text>

  <!-- Situation 4 -->
  <rect x="12" y="325" width="216" height="60" rx="6" fill="transparent"/>
  <text x="28" y="347" class="font-oswald" fill="#ffffff" font-size="11" font-weight="600" letter-spacing="0.5" opacity="0.3">04</text>
  <text x="50" y="347" class="font-inter" fill="#ffffff" font-size="12" font-weight="400" opacity="0.5">Match à thème</text>
  <text x="50" y="365" class="font-inter" fill="#ffffff" font-size="10" opacity="0.25">1 schéma · 14 éléments</text>

  <!-- Add situation button -->
  <rect x="12" y="405" width="216" height="40" rx="6" fill="transparent" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="4,4"/>
  <text x="120" y="430" class="font-inter" fill="#ffffff" font-size="12" text-anchor="middle" opacity="0.25">+ Ajouter une situation</text>

  <!-- Bottom sidebar -->
  <g transform="translate(0, 1450)">
    <line x1="20" y1="0" x2="220" y2="0" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    <circle cx="40" cy="50" r="18" fill="#00D4FF" opacity="0.15" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.3"/>
    <text x="40" y="56" class="font-oswald" fill="#00D4FF" font-size="13" text-anchor="middle">PR</text>
    <text x="68" y="46" class="font-inter" fill="#ffffff" font-size="13" font-weight="500" opacity="0.7">Preview</text>
    <text x="68" y="62" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">preview@placeauxcoachs.fr</text>
  </g>

  <!-- === HEADER BAR === -->
  <rect x="240" y="0" width="1200" height="72" fill="#0A0A0F" opacity="0.8"/>
  <line x1="240" y1="72" x2="1440" y2="72" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>

  <!-- Breadcrumb -->
  <text x="280" y="30" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">Entraînements</text>
  <text x="370" y="30" class="font-inter" fill="#ffffff" font-size="11" opacity="0.2">›</text>
  <text x="385" y="30" class="font-inter" fill="#00D4FF" font-size="11" opacity="0.7">Améliorer le jeu du PB dans l'exploitation</text>

  <!-- Training title -->
  <text x="280" y="56" class="font-oswald" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.5">Améliorer le jeu du PB dans l'exploitation du surnombre</text>

  <!-- Status badge -->
  <rect x="870" y="38" width="60" height="24" rx="4" fill="#BCFF00" opacity="0.15"/>
  <text x="900" y="55" class="font-inter" fill="#BCFF00" font-size="11" font-weight="500" text-anchor="middle">Prêt</text>

  <!-- Action buttons -->
  <rect x="1130" y="22" width="100" height="34" rx="4" fill="transparent" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="1180" y="44" class="font-inter" fill="#ffffff" font-size="12" text-anchor="middle" opacity="0.5">← Retour</text>

  <rect x="1245" y="22" width="80" height="34" rx="4" fill="transparent" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="1285" y="44" class="font-inter" fill="#ffffff" font-size="12" text-anchor="middle" opacity="0.5">PDF ↓</text>

  <rect x="1340" y="22" width="70" height="34" rx="4" fill="url(#ctaGrad)" filter="url(#glowOrange)"/>
  <text x="1375" y="44" class="font-oswald" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">SAUVER</text>

  <!-- === METADATA BAR === -->
  <rect x="240" y="72" width="1200" height="50" fill="#0B0B14"/>
  <line x1="240" y1="122" x2="1440" y2="122" stroke="#ffffff" stroke-width="0.5" opacity="0.04"/>

  <!-- Metadata items -->
  <text x="290" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">Thème :</text>
  <text x="340" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.6">Exploitation du surnombre</text>

  <line x1="530" y1="82" x2="530" y2="112" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <text x="550" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">Date :</text>
  <text x="585" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.6">12/03/2026</text>

  <line x1="670" y1="82" x2="670" y2="112" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <text x="690" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">Catégorie :</text>
  <rect x="755" y="88" width="40" height="20" rx="3" fill="#00D4FF" opacity="0.12"/>
  <text x="775" y="103" class="font-inter" fill="#00D4FF" font-size="10" text-anchor="middle">U15</text>

  <line x1="820" y1="82" x2="820" y2="112" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <text x="840" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">Effectif :</text>
  <text x="890" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.6">16</text>

  <line x1="920" y1="82" x2="920" y2="112" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <text x="940" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.3">Durée :</text>
  <text x="985" y="102" class="font-inter" fill="#ffffff" font-size="11" opacity="0.6">1h30</text>

  <!-- === SITUATION CONTENT === -->
  <!-- Situation header -->
  <g transform="translate(280, 145)">
    <text x="0" y="30" class="font-oswald" fill="#ffffff" font-size="20" font-weight="600" letter-spacing="0.5">Échauffement, mise en train</text>
    <text x="0" y="52" class="font-inter" fill="#ffffff" font-size="13" opacity="0.35">Activation et montée en température progressive des joueurs</text>

    <!-- Schema tabs -->
    <g transform="translate(0, 70)">
      <!-- Tab 1 active -->
      <rect width="90" height="30" rx="4" fill="#00D4FF" opacity="0.1" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.3"/>
      <text x="45" y="20" class="font-inter" fill="#00D4FF" font-size="11" font-weight="500" text-anchor="middle">Schéma 1</text>
      <!-- Tab 2 -->
      <rect x="100" width="90" height="30" rx="4" fill="transparent" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
      <text x="145" y="20" class="font-inter" fill="#ffffff" font-size="11" text-anchor="middle" opacity="0.35">Schéma 2</text>
      <!-- Tab 3 -->
      <rect x="200" width="90" height="30" rx="4" fill="transparent" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
      <text x="245" y="20" class="font-inter" fill="#ffffff" font-size="11" text-anchor="middle" opacity="0.35">Schéma 3</text>
      <!-- Add tab -->
      <rect x="300" width="36" height="30" rx="4" fill="transparent" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08" stroke-dasharray="3,3"/>
      <text x="318" y="20" class="font-inter" fill="#ffffff" font-size="14" text-anchor="middle" opacity="0.2">+</text>

      <!-- Edit/copy buttons -->
      <rect x="900" width="100" height="30" rx="4" fill="#00D4FF" opacity="0.08"/>
      <text x="950" y="20" class="font-inter" fill="#00D4FF" font-size="11" text-anchor="middle">✏ Modifier</text>
      <rect x="1010" width="80" height="30" rx="4" fill="transparent" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08"/>
      <text x="1050" y="20" class="font-inter" fill="#ffffff" font-size="11" text-anchor="middle" opacity="0.35">Copier</text>
    </g>

    <!-- === COURT SCHEMA === -->
    <g transform="translate(0, 120)">
      <rect width="1100" height="380" rx="8" fill="#12121A" stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.15"/>
      <!-- Court -->
      <rect x="50" y="20" width="1000" height="340" rx="4" fill="url(#courtGrad)"/>
      <!-- Court markings -->
      <line x1="550" y1="20" x2="550" y2="360" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <circle cx="550" cy="190" r="40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <!-- Goal areas - left -->
      <ellipse cx="50" cy="190" rx="120" ry="100" fill="#C8850A" opacity="0.5"/>
      <path d="M 50 120 Q 180 190 50 260" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
      <path d="M 50 140 Q 150 190 50 240" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      <rect x="48" y="165" width="6" height="50" fill="#ffffff" opacity="0.7"/>
      <!-- Goal areas - right -->
      <ellipse cx="1050" cy="190" rx="120" ry="100" fill="#C8850A" opacity="0.5"/>
      <path d="M 1050 120 Q 920 190 1050 260" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-dasharray="6,4"/>
      <path d="M 1050 140 Q 950 190 1050 240" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      <rect x="1046" y="165" width="6" height="50" fill="#ffffff" opacity="0.7"/>

      <!-- Red team players -->
      <circle cx="350" cy="130" r="14" fill="#FF3D71"/>
      <circle cx="350" cy="190" r="14" fill="#FF3D71"/>
      <circle cx="350" cy="250" r="14" fill="#FF3D71"/>
      <circle cx="420" cy="160" r="14" fill="#FF3D71"/>
      <circle cx="420" cy="220" r="14" fill="#FF3D71"/>
      <circle cx="280" cy="190" r="14" fill="#FF3D71"/>

      <!-- Yellow team players -->
      <circle cx="750" cy="130" r="14" fill="#FFEB3B"/>
      <circle cx="750" cy="250" r="14" fill="#FFEB3B"/>
      <circle cx="800" cy="190" r="14" fill="#FFEB3B"/>
      <circle cx="700" cy="190" r="14" fill="#FFEB3B"/>

      <!-- Goalkeeper -->
      <circle cx="110" cy="190" r="14" fill="#9C27B0"/>

      <!-- Ball -->
      <circle cx="460" cy="175" r="7" fill="#BCFF00"/>

      <!-- Trajectories -->
      <path d="M 420 160 L 520 140" stroke="#BCFF00" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
      <path d="M 350 130 L 300 100" stroke="#FF6B35" stroke-width="2" stroke-dasharray="8,4" opacity="0.4"/>
      <path d="M 420 220 L 500 250" stroke="#BCFF00" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
    </g>
  </g>

  <!-- === DESCRIPTION SECTIONS === -->
  <g transform="translate(280, 700)">
    <!-- À FAIRE -->
    <rect width="1100" height="120" rx="8" fill="#ffffff" opacity="0.02"/>
    <rect width="4" height="120" rx="2" fill="#FF6B35"/>
    <text x="24" y="30" class="font-oswald" fill="#FF6B35" font-size="14" font-weight="600" letter-spacing="1">À FAIRE</text>
    <text x="24" y="55" class="font-inter" fill="#ffffff" font-size="13" font-weight="300" opacity="0.6">Pour une mise en place rapide de l'activité :</text>
    <text x="24" y="78" class="font-inter" fill="#ffffff" font-size="13" font-weight="300" opacity="0.5">• Distribuer les chasubles par équipe</text>
    <text x="24" y="98" class="font-inter" fill="#ffffff" font-size="13" font-weight="300" opacity="0.5">• Poser les plots pour délimiter les zones de jeu</text>
  </g>

  <g transform="translate(280, 840)">
    <!-- À VÉRIFIER / OBSERVER -->
    <rect width="1100" height="100" rx="8" fill="#ffffff" opacity="0.02"/>
    <rect width="4" height="100" rx="2" fill="#00D4FF"/>
    <text x="24" y="30" class="font-oswald" fill="#00D4FF" font-size="14" font-weight="600" letter-spacing="1">À VÉRIFIER / OBSERVER</text>
    <text x="24" y="55" class="font-inter" fill="#ffffff" font-size="13" font-weight="300" opacity="0.6">Observer la qualité des passes et la vitesse de circulation du ballon.</text>
    <text x="24" y="78" class="font-inter" fill="#ffffff" font-size="13" font-weight="300" opacity="0.5">Vérifier la bonne occupation du terrain pour étoffer l'espace des PDI.</text>
  </g>

  <g transform="translate(280, 960)">
    <!-- À DIRE AUX JOUEURS -->
    <rect width="1100" height="100" rx="8" fill="#ffffff" opacity="0.02"/>
    <rect width="4" height="100" rx="2" fill="#BCFF00"/>
    <text x="24" y="30" class="font-oswald" fill="#BCFF00" font-size="14" font-weight="600" letter-spacing="1">À DIRE AUX JOUEURS</text>
    <text x="24" y="55" class="font-inter" fill="#ffffff" font-size="13" font-weight="300" opacity="0.6">Focus sur les déplacements et le lien entre les joueurs : 6 à 7 mètres</text>
    <text x="24" y="78" class="font-inter" fill="#ffffff" font-size="13" font-weight="300" opacity="0.5">entre chaque joueur pour maintenir le dispositif.</text>
  </g>

  <g transform="translate(280, 1080)">
    <!-- À FAIRE ÉVOLUER -->
    <rect width="1100" height="80" rx="8" fill="#ffffff" opacity="0.02"/>
    <rect width="4" height="80" rx="2" fill="#7B61FF"/>
    <text x="24" y="30" class="font-oswald" fill="#7B61FF" font-size="14" font-weight="600" letter-spacing="1">À FAIRE ÉVOLUER OU MODIFIER</text>
    <text x="24" y="55" class="font-inter" fill="#ffffff" font-size="13" font-weight="300" opacity="0.6">Limiter le nombre de contacts (1-2-3) avec le ballon pour accélérer le jeu collectif.</text>
  </g>

  <!-- === SECOND SITUATION SEPARATOR === -->
  <g transform="translate(280, 1200)">
    <line x1="0" y1="0" x2="1100" y2="0" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    <text x="0" y="40" class="font-oswald" fill="#ffffff" font-size="20" font-weight="600" letter-spacing="0.5" opacity="0.3">Travail du duel 1v1 / Tirer / Feinter</text>
    <text x="0" y="62" class="font-inter" fill="#ffffff" font-size="13" opacity="0.2">2 schémas · 12 éléments</text>

    <!-- Collapsed court preview -->
    <rect y="80" width="1100" height="250" rx="8" fill="#12121A" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
    <rect x="50" y="100" width="1000" height="210" rx="4" fill="url(#courtGrad)" opacity="0.5"/>
    <line x1="550" y1="100" x2="550" y2="310" stroke="#fff" stroke-width="1" opacity="0.2"/>
    <circle cx="550" cy="205" r="30" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
    <!-- Faded players -->
    <circle cx="350" cy="180" r="10" fill="#FF3D71" opacity="0.4"/>
    <circle cx="350" cy="230" r="10" fill="#FF3D71" opacity="0.4"/>
    <circle cx="750" cy="180" r="10" fill="#FFEB3B" opacity="0.4"/>
    <circle cx="750" cy="230" r="10" fill="#FFEB3B" opacity="0.4"/>

    <!-- Expand hint -->
    <text x="550" y="195" class="font-inter" fill="#ffffff" font-size="14" text-anchor="middle" opacity="0.15">Cliquer pour développer</text>
  </g>

  <!-- Diagonal decoration -->
  <line x1="1350" y1="700" x2="1440" y2="760" stroke="#00D4FF" stroke-width="1" opacity="0.06"/>
  <line x1="1360" y1="700" x2="1440" y2="750" stroke="#00D4FF" stroke-width="0.5" opacity="0.04"/>
  <line x1="1370" y1="1100" x2="1440" y2="1150" stroke="#FF6B35" stroke-width="1" opacity="0.05"/>
</svg>
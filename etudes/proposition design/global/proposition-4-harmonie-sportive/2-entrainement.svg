<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1500" width="1440" height="1500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&amp;family=DM+Sans:wght@300;400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Urbanist', sans-serif; }
      .font-body { font-family: 'DM Sans', sans-serif; }
    </style>
    <linearGradient id="bgSoft" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F8F6FF"/>
      <stop offset="40%" stop-color="#FFF7F3"/>
      <stop offset="100%" stop-color="#F5F0FF"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#E8553D"/>
    </linearGradient>
    <linearGradient id="ctaPrimary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8553D"/>
      <stop offset="100%" stop-color="#F27A3A"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBFF"/>
      <stop offset="100%" stop-color="#F8F5FF"/>
    </linearGradient>
    <linearGradient id="courtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="blob1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5B3FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFB8A8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7C5CFC" flood-opacity="0.06"/>
    </filter>
    <filter id="cardShadowLg">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#7C5CFC" flood-opacity="0.08"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="btnShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#E8553D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1440" height="1500" fill="url(#bgSoft)"/>
  <ellipse cx="1200" cy="500" rx="300" ry="200" fill="url(#blob1)" filter="url(#softGlow)"/>

  <!-- SIDEBAR -->
  <rect width="250" height="1500" fill="url(#sideGrad)"/>
  <line x1="250" y1="0" x2="250" y2="1500" stroke="#7C5CFC" stroke-width="0.5" opacity="0.08"/>

  <!-- Logo -->
  <circle cx="40" cy="36" r="14" fill="url(#heroGrad)" opacity="0.85"/>
  <circle cx="40" cy="36" r="6" fill="#ffffff" opacity="0.9"/>
  <text x="62" y="42" class="font-display" fill="#1E1340" font-size="16" font-weight="800">Place aux Coachs</text>
  <line x1="20" y1="68" x2="230" y2="68" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>

  <!-- Situations list -->
  <text x="24" y="98" class="font-display" fill="#1E1340" font-size="11" font-weight="700" opacity="0.25" letter-spacing="1.5">SITUATIONS</text>

  <!-- Situation 1 - Active -->
  <rect x="12" y="112" width="226" height="60" rx="12" fill="#7C5CFC" opacity="0.08"/>
  <rect x="12" y="112" width="4" height="60" rx="2" fill="#E8553D"/>
  <text x="30" y="134" class="font-display" fill="#E8553D" font-size="11" font-weight="800">01</text>
  <text x="52" y="134" class="font-display" fill="#1E1340" font-size="12" font-weight="700">Échauffement, mise en train</text>
  <text x="52" y="152" class="font-body" fill="#1E1340" font-size="10" opacity="0.35">3 schémas · 8 éléments</text>

  <!-- Situation 2 -->
  <text x="30" y="200" class="font-display" fill="#1E1340" font-size="11" font-weight="800" opacity="0.2">02</text>
  <text x="52" y="200" class="font-display" fill="#1E1340" font-size="12" font-weight="500" opacity="0.45">Travail du duel 1v1 / Tirer</text>
  <text x="52" y="218" class="font-body" fill="#1E1340" font-size="10" opacity="0.25">2 schémas · 12 éléments</text>

  <!-- Situation 3 -->
  <text x="30" y="260" class="font-display" fill="#1E1340" font-size="11" font-weight="800" opacity="0.2">03</text>
  <text x="52" y="260" class="font-display" fill="#1E1340" font-size="12" font-weight="500" opacity="0.45">Situation en phase travail</text>
  <text x="52" y="278" class="font-body" fill="#1E1340" font-size="10" opacity="0.25">1 schéma · 6 éléments</text>

  <!-- Situation 4 -->
  <text x="30" y="320" class="font-display" fill="#1E1340" font-size="11" font-weight="800" opacity="0.2">04</text>
  <text x="52" y="320" class="font-display" fill="#1E1340" font-size="12" font-weight="500" opacity="0.45">Match à thème</text>
  <text x="52" y="338" class="font-body" fill="#1E1340" font-size="10" opacity="0.25">1 schéma · 14 éléments</text>

  <!-- Add situation -->
  <rect x="12" y="365" width="226" height="38" rx="10" fill="none" stroke="#7C5CFC" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="5,4"/>
  <text x="125" y="390" class="font-body" fill="#7C5CFC" font-size="12" text-anchor="middle" opacity="0.3">+ Ajouter une situation</text>

  <!-- HEADER BAR -->
  <rect x="250" y="0" width="1190" height="72" fill="#ffffff" opacity="0.85"/>
  <line x1="250" y1="72" x2="1440" y2="72" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>

  <!-- Breadcrumb -->
  <text x="290" y="28" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">Entraînements</text>
  <text x="375" y="28" class="font-body" fill="#1E1340" font-size="11" opacity="0.2">›</text>
  <text x="390" y="28" class="font-body" fill="#E8553D" font-size="11" font-weight="500" opacity="0.7">Améliorer le jeu du PB</text>

  <!-- Title -->
  <text x="290" y="56" class="font-display" fill="#1E1340" font-size="22" font-weight="900">Améliorer le jeu du PB dans l'exploitation du surnombre</text>

  <!-- Status -->
  <rect x="860" y="38" width="58" height="26" rx="13" fill="#22C55E" opacity="0.1"/>
  <circle cx="878" cy="51" r="4" fill="#22C55E"/>
  <text x="900" y="56" class="font-body" fill="#16A34A" font-size="11" font-weight="600">Prêt</text>

  <!-- Action buttons -->
  <rect x="1130" y="22" width="90" height="36" rx="18" fill="none" stroke="#1E1340" stroke-width="1" stroke-opacity="0.12"/>
  <text x="1175" y="45" class="font-display" fill="#1E1340" font-size="12" font-weight="600" text-anchor="middle" opacity="0.5">← Retour</text>

  <rect x="1235" y="22" width="70" height="36" rx="18" fill="none" stroke="#7C5CFC" stroke-width="1" stroke-opacity="0.2"/>
  <text x="1270" y="45" class="font-display" fill="#7C5CFC" font-size="12" font-weight="600" text-anchor="middle">PDF</text>

  <rect x="1320" y="22" width="90" height="36" rx="18" fill="url(#ctaPrimary)" filter="url(#btnShadow)"/>
  <text x="1365" y="45" class="font-display" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Sauver</text>

  <!-- METADATA BAR -->
  <rect x="250" y="72" width="1190" height="48" fill="#ffffff" opacity="0.5"/>
  <line x1="250" y1="120" x2="1440" y2="120" stroke="#7C5CFC" stroke-width="0.5" opacity="0.04"/>

  <text x="290" y="102" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">Thème</text>
  <text x="330" y="102" class="font-body" fill="#1E1340" font-size="11" font-weight="600" opacity="0.6">Exploitation du surnombre</text>

  <rect x="530" y="86" width="1" height="24" fill="#7C5CFC" opacity="0.08"/>
  <text x="548" y="102" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">Date</text>
  <text x="578" y="102" class="font-body" fill="#1E1340" font-size="11" font-weight="600" opacity="0.6">12/03/2026</text>

  <rect x="660" y="86" width="1" height="24" fill="#7C5CFC" opacity="0.08"/>
  <text x="678" y="102" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">Catégorie</text>
  <rect x="735" y="88" width="40" height="22" rx="11" fill="#7C5CFC" opacity="0.08"/>
  <text x="755" y="103" class="font-body" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U15</text>

  <rect x="800" y="86" width="1" height="24" fill="#7C5CFC" opacity="0.08"/>
  <text x="818" y="102" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">Effectif</text>
  <text x="862" y="102" class="font-body" fill="#1E1340" font-size="11" font-weight="600" opacity="0.6">16</text>

  <rect x="890" y="86" width="1" height="24" fill="#7C5CFC" opacity="0.08"/>
  <text x="908" y="102" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">Durée</text>
  <text x="948" y="102" class="font-body" fill="#1E1340" font-size="11" font-weight="600" opacity="0.6">1h30</text>

  <!-- SITUATION CONTENT -->
  <g transform="translate(285, 145)">
    <text x="0" y="30" class="font-display" fill="#1E1340" font-size="22" font-weight="900">Échauffement, mise en train</text>
    <text x="0" y="52" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.4">Activation et montée en température progressive</text>

    <!-- Schema tabs -->
    <g transform="translate(0, 70)">
      <rect width="90" height="32" rx="16" fill="#7C5CFC" opacity="0.1"/>
      <text x="45" y="21" class="font-display" fill="#7C5CFC" font-size="12" font-weight="700" text-anchor="middle">Schéma 1</text>
      <rect x="100" width="90" height="32" rx="16" fill="none" stroke="#1E1340" stroke-width="0.5" stroke-opacity="0.08"/>
      <text x="145" y="21" class="font-display" fill="#1E1340" font-size="12" font-weight="500" text-anchor="middle" opacity="0.35">Schéma 2</text>
      <rect x="200" width="90" height="32" rx="16" fill="none" stroke="#1E1340" stroke-width="0.5" stroke-opacity="0.08"/>
      <text x="245" y="21" class="font-display" fill="#1E1340" font-size="12" font-weight="500" text-anchor="middle" opacity="0.35">Schéma 3</text>
      <rect x="300" width="36" height="32" rx="16" fill="none" stroke="#7C5CFC" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4,3"/>
      <text x="318" y="21" class="font-body" fill="#7C5CFC" font-size="14" text-anchor="middle" opacity="0.3">+</text>

      <!-- Right actions -->
      <rect x="900" width="90" height="32" rx="16" fill="#E8553D" opacity="0.08"/>
      <text x="945" y="21" class="font-display" fill="#E8553D" font-size="12" font-weight="600" text-anchor="middle">Modifier</text>
      <rect x="1000" width="70" height="32" rx="16" fill="none" stroke="#1E1340" stroke-width="0.5" stroke-opacity="0.1"/>
      <text x="1035" y="21" class="font-display" fill="#1E1340" font-size="12" font-weight="500" text-anchor="middle" opacity="0.35">Copier</text>
    </g>

    <!-- COURT SCHEMA -->
    <g transform="translate(0, 120)" filter="url(#cardShadowLg)">
      <rect width="1100" height="380" rx="16" fill="#ffffff"/>
      <rect x="20" y="15" width="1060" height="350" rx="10" fill="url(#courtGrad)"/>
      <!-- Court lines -->
      <line x1="550" y1="15" x2="550" y2="365" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <circle cx="550" cy="190" r="40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <!-- Goal areas -->
      <path d="M 20 120 Q 140 190 20 260" fill="#C8850A" opacity="0.45"/>
      <path d="M 20 120 Q 140 190 20 260" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <path d="M 20 95 Q 170 190 20 285" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-dasharray="6,4"/>
      <rect x="18" y="160" width="6" height="60" rx="2" fill="#ffffff" opacity="0.7"/>
      <path d="M 1080 120 Q 960 190 1080 260" fill="#C8850A" opacity="0.45"/>
      <path d="M 1080 120 Q 960 190 1080 260" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <path d="M 1080 95 Q 930 190 1080 285" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-dasharray="6,4"/>
      <rect x="1076" y="160" width="6" height="60" rx="2" fill="#ffffff" opacity="0.7"/>
      <!-- Red team -->
      <circle cx="330" cy="130" r="14" fill="#E8553D"/>
      <circle cx="330" cy="190" r="14" fill="#E8553D"/>
      <circle cx="330" cy="250" r="14" fill="#E8553D"/>
      <circle cx="400" cy="160" r="14" fill="#E8553D"/>
      <circle cx="400" cy="220" r="14" fill="#E8553D"/>
      <circle cx="260" cy="190" r="14" fill="#E8553D"/>
      <!-- Yellow team -->
      <circle cx="720" cy="130" r="14" fill="#F2B705"/>
      <circle cx="720" cy="250" r="14" fill="#F2B705"/>
      <circle cx="780" cy="190" r="14" fill="#F2B705"/>
      <circle cx="680" cy="190" r="14" fill="#F2B705"/>
      <!-- Goalkeeper -->
      <circle cx="90" cy="190" r="15" fill="#9C27B0"/>
      <!-- Ball -->
      <circle cx="440" cy="175" r="7" fill="#BCFF00"/>
      <!-- Trajectories -->
      <path d="M 400 160 L 490 140" stroke="#E8553D" stroke-width="2" stroke-dasharray="7,4" opacity="0.5"/>
      <path d="M 400 220 L 490 250" stroke="#E8553D" stroke-width="2" stroke-dasharray="7,4" opacity="0.4"/>
    </g>
  </g>

  <!-- DESCRIPTION SECTIONS (with colored borders and icons) -->
  <g transform="translate(285, 700)">
    <!-- À FAIRE -->
    <g filter="url(#cardShadow)">
      <rect width="1100" height="120" rx="14" fill="#ffffff"/>
      <rect width="5" height="120" rx="2.5" fill="#E8553D"/>
      <!-- Icon -->
      <rect x="20" y="18" width="36" height="36" rx="10" fill="#FFF0EC"/>
      <text x="38" y="44" font-size="18" text-anchor="middle">📋</text>
      <text x="70" y="40" class="font-display" fill="#E8553D" font-size="14" font-weight="800">À FAIRE</text>
      <text x="70" y="65" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.55">Pour une mise en place rapide de l'activité :</text>
      <text x="70" y="88" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.45">• Distribuer les chasubles par équipe</text>
      <text x="70" y="108" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.45">• Poser les plots pour délimiter les zones de jeu</text>
    </g>
  </g>

  <g transform="translate(285, 840)">
    <!-- À VÉRIFIER -->
    <g filter="url(#cardShadow)">
      <rect width="1100" height="100" rx="14" fill="#ffffff"/>
      <rect width="5" height="100" rx="2.5" fill="#7C5CFC"/>
      <rect x="20" y="18" width="36" height="36" rx="10" fill="#F0ECFF"/>
      <text x="38" y="44" font-size="18" text-anchor="middle">👁️</text>
      <text x="70" y="40" class="font-display" fill="#7C5CFC" font-size="14" font-weight="800">À VÉRIFIER / OBSERVER</text>
      <text x="70" y="65" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.55">Observer la qualité des passes et la vitesse de circulation du ballon.</text>
      <text x="70" y="88" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.45">Vérifier la bonne occupation du terrain pour étoffer l'espace des PDI.</text>
    </g>
  </g>

  <g transform="translate(285, 960)">
    <!-- À DIRE -->
    <g filter="url(#cardShadow)">
      <rect width="1100" height="100" rx="14" fill="#ffffff"/>
      <rect width="5" height="100" rx="2.5" fill="#F2B705"/>
      <rect x="20" y="18" width="36" height="36" rx="10" fill="#FFF8E0"/>
      <text x="38" y="44" font-size="18" text-anchor="middle">💬</text>
      <text x="70" y="40" class="font-display" fill="#9E7800" font-size="14" font-weight="800">À DIRE AUX JOUEURS</text>
      <text x="70" y="65" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.55">Focus sur les déplacements et le lien entre les joueurs : 6 à 7 mètres</text>
      <text x="70" y="88" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.45">entre chaque joueur pour maintenir le dispositif.</text>
    </g>
  </g>

  <g transform="translate(285, 1080)">
    <!-- À FAIRE ÉVOLUER -->
    <g filter="url(#cardShadow)">
      <rect width="1100" height="80" rx="14" fill="#ffffff"/>
      <rect width="5" height="80" rx="2.5" fill="#22C55E"/>
      <rect x="20" y="18" width="36" height="36" rx="10" fill="#ECFDF5"/>
      <text x="38" y="44" font-size="18" text-anchor="middle">🔄</text>
      <text x="70" y="40" class="font-display" fill="#16A34A" font-size="14" font-weight="800">À FAIRE ÉVOLUER</text>
      <text x="70" y="65" class="font-body" fill="#1E1340" font-size="13" font-weight="400" opacity="0.55">Limiter le nombre de contacts (1-2-3) avec le ballon pour accélérer le jeu collectif.</text>
    </g>
  </g>

  <!-- Second situation preview (collapsed) -->
  <g transform="translate(285, 1200)">
    <line x1="0" y1="0" x2="1100" y2="0" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>
    <text x="0" y="40" class="font-display" fill="#1E1340" font-size="20" font-weight="900" opacity="0.25">Travail du duel 1v1 / Tirer / Feinter</text>
    <text x="0" y="62" class="font-body" fill="#1E1340" font-size="12" opacity="0.2">2 schémas · 12 éléments</text>

    <g transform="translate(0, 80)" filter="url(#cardShadow)">
      <rect width="1100" height="200" rx="14" fill="#ffffff" opacity="0.6"/>
      <rect x="30" y="20" width="1040" height="160" rx="8" fill="url(#courtGrad)" opacity="0.35"/>
      <line x1="550" y1="20" x2="550" y2="180" stroke="#fff" stroke-width="1" opacity="0.15"/>
      <circle cx="550" cy="100" r="20" fill="none" stroke="#fff" stroke-width="1" opacity="0.15"/>
      <circle cx="400" cy="85" r="8" fill="#E8553D" opacity="0.3"/>
      <circle cx="400" cy="115" r="8" fill="#E8553D" opacity="0.3"/>
      <circle cx="700" cy="100" r="8" fill="#F2B705" opacity="0.3"/>
      <text x="550" y="108" class="font-body" fill="#1E1340" font-size="13" text-anchor="middle" opacity="0.15">Cliquer pour développer</text>
    </g>
  </g>
</svg>
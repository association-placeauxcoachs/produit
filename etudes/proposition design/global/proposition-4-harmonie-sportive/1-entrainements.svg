<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&amp;family=DM+Sans:wght@300;400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Urbanist', sans-serif; }
      .font-body { font-family: 'DM Sans', sans-serif; }
    </style>
    <linearGradient id="bgSoft" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F8F6FF"/>
      <stop offset="40%" stop-color="#FFF7F3"/>
      <stop offset="100%" stop-color="#F5F0FF"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#E8553D"/>
    </linearGradient>
    <linearGradient id="ctaPrimary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8553D"/>
      <stop offset="100%" stop-color="#F27A3A"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBFF"/>
      <stop offset="100%" stop-color="#F8F5FF"/>
    </linearGradient>
    <linearGradient id="courtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="blob1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5B3FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFB8A8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="blob2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD4B8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFB8D4" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7C5CFC" flood-opacity="0.06"/>
    </filter>
    <filter id="cardShadowHover">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#7C5CFC" flood-opacity="0.1"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="btnShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#E8553D" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="1440" height="900" fill="url(#bgSoft)"/>
  <!-- Organic blobs (coherent with accueil) -->
  <ellipse cx="900" cy="200" rx="300" ry="200" fill="url(#blob1)" filter="url(#softGlow)"/>
  <ellipse cx="1300" cy="700" rx="250" ry="180" fill="url(#blob2)" filter="url(#softGlow)"/>

  <!-- === SIDEBAR === -->
  <rect width="250" height="900" fill="url(#sideGrad)"/>
  <line x1="250" y1="0" x2="250" y2="900" stroke="#7C5CFC" stroke-width="0.5" opacity="0.08"/>

  <!-- Logo -->
  <circle cx="40" cy="36" r="14" fill="url(#heroGrad)" opacity="0.85"/>
  <circle cx="40" cy="36" r="6" fill="#ffffff" opacity="0.9"/>
  <text x="62" y="42" class="font-display" fill="#1E1340" font-size="16" font-weight="800">Place aux Coachs</text>

  <line x1="20" y1="68" x2="230" y2="68" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>

  <!-- Active nav item -->
  <rect x="12" y="84" width="226" height="44" rx="12" fill="#7C5CFC" opacity="0.08"/>
  <rect x="12" y="84" width="4" height="44" rx="2" fill="#E8553D"/>
  <text x="50" y="112" class="font-display" fill="#E8553D" font-size="14" font-weight="700">Entraînements</text>

  <text x="50" y="155" class="font-display" fill="#1E1340" font-size="14" font-weight="500" opacity="0.4">Communauté</text>

  <!-- Groups section -->
  <text x="24" y="210" class="font-display" fill="#1E1340" font-size="11" font-weight="700" opacity="0.2" letter-spacing="1.5">GROUPES DE TRAVAIL</text>
  <text x="50" y="240" class="font-body" fill="#1E1340" font-size="13" font-weight="500" opacity="0.4">Mon club HB</text>
  <circle cx="215" cy="235" r="4" fill="#E8553D" opacity="0.5"/>
  <text x="50" y="268" class="font-body" fill="#1E1340" font-size="13" font-weight="500" opacity="0.35">Formation U15</text>

  <!-- User -->
  <g transform="translate(0, 760)">
    <line x1="20" y1="0" x2="230" y2="0" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>
    <circle cx="42" cy="50" r="20" fill="#E8553D" opacity="0.1" stroke="#E8553D" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="42" y="56" class="font-display" fill="#E8553D" font-size="13" font-weight="700" text-anchor="middle">PR</text>
    <text x="72" y="46" class="font-display" fill="#1E1340" font-size="13" font-weight="700">Preview</text>
    <text x="72" y="62" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">preview@placeauxcoachs.fr</text>

    <text x="50" y="102" class="font-body" fill="#1E1340" font-size="13" opacity="0.35">Profil</text>
    <text x="50" y="124" class="font-body" fill="#1E1340" font-size="13" opacity="0.35">Déconnexion</text>
  </g>

  <!-- === TOP BAR === -->
  <rect x="250" y="0" width="1190" height="72" fill="#ffffff" opacity="0.7"/>
  <line x1="250" y1="72" x2="1440" y2="72" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>

  <!-- Search -->
  <rect x="290" y="17" width="460" height="40" rx="20" fill="#ffffff" stroke="#7C5CFC" stroke-width="1" stroke-opacity="0.1"/>
  <circle cx="314" cy="37" r="8" fill="none" stroke="#1E1340" stroke-width="1.5" opacity="0.25"/>
  <line x1="320" y1="43" x2="325" y2="48" stroke="#1E1340" stroke-width="1.5" opacity="0.25"/>
  <text x="340" y="42" class="font-body" fill="#1E1340" font-size="13" opacity="0.25">Rechercher un entraînement...</text>

  <!-- Filter tabs -->
  <rect x="800" y="22" width="140" height="32" rx="16" fill="#7C5CFC" opacity="0.08"/>
  <text x="870" y="43" class="font-display" fill="#7C5CFC" font-size="13" font-weight="700" text-anchor="middle">Mes entraînements</text>
  <text x="990" y="43" class="font-display" fill="#1E1340" font-size="13" font-weight="500" text-anchor="middle" opacity="0.35">Communauté</text>
  <text x="1090" y="43" class="font-display" fill="#1E1340" font-size="13" font-weight="500" text-anchor="middle" opacity="0.35">Groupes</text>

  <!-- Create button -->
  <rect x="1290" y="17" width="110" height="40" rx="20" fill="url(#ctaPrimary)" filter="url(#btnShadow)"/>
  <text x="1345" y="42" class="font-display" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">+ Créer</text>

  <!-- === CARDS GRID === -->
  <!-- Row 1 -->
  <!-- Card 1 - Status: Prêt (green) -->
  <g transform="translate(285, 95)" filter="url(#cardShadowHover)">
    <rect width="365" height="240" rx="16" fill="#ffffff"/>
    <!-- Status colored top accent -->
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#22C55E"/>
    <!-- Court thumbnail -->
    <rect x="15" y="18" width="335" height="100" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="118" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="182" cy="68" r="12" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="130" cy="55" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="130" cy="80" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="230" cy="55" r="5" fill="#F2B705" opacity="0.8"/>
    <circle cx="230" cy="80" r="5" fill="#F2B705" opacity="0.8"/>
    <circle cx="160" cy="65" r="3" fill="#BCFF00"/>
    <!-- Title -->
    <text x="15" y="148" class="font-display" fill="#1E1340" font-size="15" font-weight="700">Améliorer le jeu du PB dans l'exploitation</text>
    <!-- Tags -->
    <rect x="15" y="162" width="42" height="22" rx="11" fill="#7C5CFC" opacity="0.08"/>
    <text x="36" y="177" class="font-body" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U15</text>
    <rect x="64" y="162" width="65" height="22" rx="11" fill="#E8553D" opacity="0.08"/>
    <text x="96" y="177" class="font-body" fill="#E8553D" font-size="10" font-weight="600" text-anchor="middle">Attaque</text>
    <rect x="136" y="162" width="52" height="22" rx="11" fill="#F2B705" opacity="0.1"/>
    <text x="162" y="177" class="font-body" fill="#9E7800" font-size="10" font-weight="600" text-anchor="middle">3 sit.</text>
    <!-- Bottom: date + status badge -->
    <text x="15" y="220" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">12 mars 2026</text>
    <rect x="290" y="204" width="58" height="26" rx="13" fill="#22C55E" opacity="0.1"/>
    <circle cx="308" cy="217" r="4" fill="#22C55E"/>
    <text x="330" y="222" class="font-body" fill="#16A34A" font-size="11" font-weight="600">Prêt</text>
  </g>

  <!-- Card 2 - Status: En cours (orange) -->
  <g transform="translate(670, 95)" filter="url(#cardShadow)">
    <rect width="365" height="240" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#E8553D"/>
    <rect x="15" y="18" width="335" height="100" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="118" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="182" cy="68" r="12" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="140" cy="60" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="220" cy="75" r="5" fill="#F2B705" opacity="0.8"/>
    <text x="15" y="148" class="font-display" fill="#1E1340" font-size="15" font-weight="700">Entrainement du jeu de PB lors d'opposition</text>
    <rect x="15" y="162" width="58" height="22" rx="11" fill="#7C5CFC" opacity="0.08"/>
    <text x="44" y="177" class="font-body" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">Seniors</text>
    <rect x="80" y="162" width="62" height="22" rx="11" fill="#E8553D" opacity="0.08"/>
    <text x="111" y="177" class="font-body" fill="#E8553D" font-size="10" font-weight="600" text-anchor="middle">Défense</text>
    <text x="15" y="220" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">10 mars 2026</text>
    <rect x="272" y="204" width="78" height="26" rx="13" fill="#E8553D" opacity="0.1"/>
    <circle cx="292" cy="217" r="4" fill="#E8553D"/>
    <text x="316" y="222" class="font-body" fill="#E8553D" font-size="11" font-weight="600">En cours</text>
  </g>

  <!-- Card 3 - Status: Terminé (purple) -->
  <g transform="translate(1055, 95)" filter="url(#cardShadow)">
    <rect width="365" height="240" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#7C5CFC"/>
    <rect x="15" y="18" width="335" height="100" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="118" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="182" cy="68" r="12" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="145" cy="58" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="145" cy="78" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="225" cy="68" r="5" fill="#F2B705" opacity="0.8"/>
    <text x="15" y="148" class="font-display" fill="#1E1340" font-size="15" font-weight="700">Initiation au jeu du PB lors l'opposition</text>
    <rect x="15" y="162" width="42" height="22" rx="11" fill="#7C5CFC" opacity="0.08"/>
    <text x="36" y="177" class="font-body" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U13</text>
    <rect x="64" y="162" width="70" height="22" rx="11" fill="#F2B705" opacity="0.1"/>
    <text x="99" y="177" class="font-body" fill="#9E7800" font-size="10" font-weight="600" text-anchor="middle">Initiation</text>
    <text x="15" y="220" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">8 mars 2026</text>
    <rect x="278" y="204" width="72" height="26" rx="13" fill="#7C5CFC" opacity="0.1"/>
    <circle cx="296" cy="217" r="4" fill="#7C5CFC"/>
    <text x="320" y="222" class="font-body" fill="#7C5CFC" font-size="11" font-weight="600">Terminé</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 4 - Brouillon (gray) -->
  <g transform="translate(285, 360)" filter="url(#cardShadow)">
    <rect width="365" height="240" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#94A3B8"/>
    <rect x="15" y="18" width="335" height="100" rx="10" fill="url(#courtGrad)" opacity="0.5"/>
    <line x1="182" y1="18" x2="182" y2="118" stroke="#fff" stroke-width="0.8" opacity="0.2"/>
    <text x="15" y="148" class="font-display" fill="#1E1340" font-size="15" font-weight="700">Entraînement du PDE et son enchaînement</text>
    <rect x="15" y="162" width="42" height="22" rx="11" fill="#7C5CFC" opacity="0.08"/>
    <text x="36" y="177" class="font-body" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U18</text>
    <text x="15" y="220" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">5 mars 2026</text>
    <rect x="272" y="204" width="78" height="26" rx="13" fill="#94A3B8" opacity="0.1"/>
    <circle cx="292" cy="217" r="4" fill="#94A3B8"/>
    <text x="320" y="222" class="font-body" fill="#64748B" font-size="11" font-weight="600">Brouillon</text>
  </g>

  <!-- Card 5 - Prêt -->
  <g transform="translate(670, 360)" filter="url(#cardShadow)">
    <rect width="365" height="240" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#22C55E"/>
    <rect x="15" y="18" width="335" height="100" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="118" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="182" cy="68" r="12" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="130" cy="50" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="130" cy="68" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="130" cy="86" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="235" cy="60" r="5" fill="#F2B705" opacity="0.8"/>
    <circle cx="235" cy="78" r="5" fill="#F2B705" opacity="0.8"/>
    <text x="15" y="148" class="font-display" fill="#1E1340" font-size="15" font-weight="700">Exploitation du surnombre en attaque</text>
    <rect x="15" y="162" width="58" height="22" rx="11" fill="#7C5CFC" opacity="0.08"/>
    <text x="44" y="177" class="font-body" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">Seniors</text>
    <rect x="80" y="162" width="80" height="22" rx="11" fill="#E8553D" opacity="0.08"/>
    <text x="120" y="177" class="font-body" fill="#E8553D" font-size="10" font-weight="600" text-anchor="middle">Surnombre</text>
    <text x="15" y="220" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">3 mars 2026</text>
    <rect x="290" y="204" width="58" height="26" rx="13" fill="#22C55E" opacity="0.1"/>
    <circle cx="308" cy="217" r="4" fill="#22C55E"/>
    <text x="330" y="222" class="font-body" fill="#16A34A" font-size="11" font-weight="600">Prêt</text>
  </g>

  <!-- Card 6 - En cours -->
  <g transform="translate(1055, 360)" filter="url(#cardShadow)">
    <rect width="365" height="240" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#E8553D"/>
    <rect x="15" y="18" width="335" height="100" rx="10" fill="url(#courtGrad)"/>
    <line x1="182" y1="18" x2="182" y2="118" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="182" cy="68" r="12" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.3"/>
    <circle cx="120" cy="60" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="120" cy="78" r="5" fill="#E8553D" opacity="0.8"/>
    <circle cx="240" cy="68" r="5" fill="#F2B705" opacity="0.8"/>
    <text x="15" y="148" class="font-display" fill="#1E1340" font-size="15" font-weight="700">Améliorer le comportement du PB face</text>
    <rect x="15" y="162" width="42" height="22" rx="11" fill="#7C5CFC" opacity="0.08"/>
    <text x="36" y="177" class="font-body" fill="#7C5CFC" font-size="10" font-weight="600" text-anchor="middle">U15</text>
    <text x="15" y="220" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">1 mars 2026</text>
    <rect x="272" y="204" width="78" height="26" rx="13" fill="#E8553D" opacity="0.1"/>
    <circle cx="292" cy="217" r="4" fill="#E8553D"/>
    <text x="316" y="222" class="font-body" fill="#E8553D" font-size="11" font-weight="600">En cours</text>
  </g>

  <!-- Row 3 partial -->
  <g transform="translate(285, 625)" filter="url(#cardShadow)">
    <rect width="365" height="240" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#22C55E"/>
    <rect x="15" y="18" width="335" height="100" rx="10" fill="url(#courtGrad)"/>
    <text x="15" y="148" class="font-display" fill="#1E1340" font-size="15" font-weight="700">Jeu en supériorité</text>
    <text x="15" y="220" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">28 fév 2026</text>
    <rect x="290" y="204" width="58" height="26" rx="13" fill="#22C55E" opacity="0.1"/>
    <circle cx="308" cy="217" r="4" fill="#22C55E"/>
    <text x="330" y="222" class="font-body" fill="#16A34A" font-size="11" font-weight="600">Prêt</text>
  </g>

  <g transform="translate(670, 625)" filter="url(#cardShadow)">
    <rect width="365" height="240" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#7C5CFC"/>
    <rect x="15" y="18" width="335" height="100" rx="10" fill="url(#courtGrad)"/>
    <text x="15" y="148" class="font-display" fill="#1E1340" font-size="15" font-weight="700">Améliorer le jeu du TAR lors l'opposition</text>
    <text x="15" y="220" class="font-body" fill="#1E1340" font-size="11" opacity="0.3">25 fév 2026</text>
    <rect x="278" y="204" width="72" height="26" rx="13" fill="#7C5CFC" opacity="0.1"/>
    <circle cx="296" cy="217" r="4" fill="#7C5CFC"/>
    <text x="320" y="222" class="font-body" fill="#7C5CFC" font-size="11" font-weight="600">Terminé</text>
  </g>

  <!-- Pagination -->
  <g transform="translate(750, 880)">
    <text x="-60" y="0" class="font-body" fill="#1E1340" font-size="12" opacity="0.25">← Précédent</text>
    <rect x="40" y="-13" width="28" height="24" rx="12" fill="#7C5CFC" opacity="0.1"/>
    <text x="54" y="3" class="font-body" fill="#7C5CFC" font-size="12" font-weight="600" text-anchor="middle">1</text>
    <text x="86" y="3" class="font-body" fill="#1E1340" font-size="12" opacity="0.3" text-anchor="middle">2</text>
    <text x="118" y="3" class="font-body" fill="#1E1340" font-size="12" opacity="0.3" text-anchor="middle">3</text>
    <text x="160" y="0" class="font-body" fill="#1E1340" font-size="12" opacity="0.25">Suivant →</text>
  </g>
</svg>
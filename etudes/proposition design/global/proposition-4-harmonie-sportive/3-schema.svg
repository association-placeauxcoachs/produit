<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&amp;family=DM+Sans:wght@300;400;500;600;700&amp;display=swap');
      .font-display { font-family: 'Urbanist', sans-serif; }
      .font-body { font-family: 'DM Sans', sans-serif; }
    </style>
    <linearGradient id="bgSoft" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F8F6FF"/>
      <stop offset="50%" stop-color="#FFF7F3"/>
      <stop offset="100%" stop-color="#F5F0FF"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#E8553D"/>
    </linearGradient>
    <linearGradient id="ctaPrimary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8553D"/>
      <stop offset="100%" stop-color="#F27A3A"/>
    </linearGradient>
    <linearGradient id="courtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="blob1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5B3FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFB8A8" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#7C5CFC" flood-opacity="0.06"/>
    </filter>
    <filter id="courtShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#1565C0" flood-opacity="0.2"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="btnShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#E8553D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1440" height="900" fill="url(#bgSoft)"/>
  <ellipse cx="1300" cy="400" rx="250" ry="200" fill="url(#blob1)" filter="url(#softGlow)"/>

  <!-- MINIMAL SIDEBAR -->
  <rect width="64" height="900" fill="#FDFBFF"/>
  <line x1="64" y1="0" x2="64" y2="900" stroke="#7C5CFC" stroke-width="0.5" opacity="0.08"/>

  <!-- Logo -->
  <circle cx="32" cy="32" r="13" fill="url(#heroGrad)" opacity="0.85"/>
  <circle cx="32" cy="32" r="5" fill="#ffffff" opacity="0.9"/>

  <!-- Nav icons -->
  <rect x="14" y="68" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="32" y="89" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.3">🏠</text>

  <rect x="14" y="110" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="32" y="131" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.3">📋</text>

  <!-- User bottom -->
  <circle cx="32" cy="830" r="16" fill="#E8553D" opacity="0.08" stroke="#E8553D" stroke-width="1.5" stroke-opacity="0.15"/>
  <text x="32" y="836" class="font-display" fill="#E8553D" font-size="11" font-weight="700" text-anchor="middle">PR</text>
  <text x="32" y="868" class="font-body" fill="#1E1340" font-size="9" text-anchor="middle" opacity="0.2">Profil</text>

  <!-- TOOLBAR -->
  <rect x="64" y="0" width="1376" height="56" fill="#ffffff" opacity="0.9"/>
  <line x1="64" y1="56" x2="1440" y2="56" stroke="#7C5CFC" stroke-width="0.5" opacity="0.06"/>

  <!-- Back -->
  <rect x="82" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="100" y="33" class="font-display" fill="#1E1340" font-size="18" text-anchor="middle" opacity="0.4">‹</text>

  <rect x="128" y="14" width="1" height="28" fill="#7C5CFC" opacity="0.06"/>

  <!-- Tools -->
  <!-- Layout -->
  <rect x="142" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="160" y="33" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.35">⊞</text>

  <!-- Cursor - Active -->
  <rect x="188" y="12" width="36" height="32" rx="10" fill="#E8553D" opacity="0.1" stroke="#E8553D" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="206" y="33" class="font-body" fill="#E8553D" font-size="14" text-anchor="middle">↖</text>

  <!-- Player -->
  <rect x="234" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="252" y="33" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.35">♟</text>

  <!-- Cone -->
  <rect x="280" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="298" y="33" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.35">▲</text>

  <!-- Trajectory -->
  <rect x="326" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="344" y="33" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.35">⤳</text>

  <rect x="376" y="14" width="1" height="28" fill="#7C5CFC" opacity="0.06"/>

  <!-- Undo -->
  <rect x="390" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="408" y="33" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.35">↩</text>
  <!-- Redo -->
  <rect x="436" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="454" y="33" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.35">↪</text>

  <rect x="486" y="14" width="1" height="28" fill="#7C5CFC" opacity="0.06"/>

  <!-- Eraser -->
  <rect x="500" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="518" y="33" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.35">◇</text>

  <!-- Help -->
  <rect x="546" y="12" width="36" height="32" rx="10" fill="#7C5CFC" opacity="0.05"/>
  <text x="564" y="33" class="font-body" fill="#1E1340" font-size="14" text-anchor="middle" opacity="0.3">?</text>

  <!-- Right buttons -->
  <rect x="1230" y="12" width="90" height="32" rx="16" fill="none" stroke="#1E1340" stroke-width="1" stroke-opacity="0.1"/>
  <text x="1275" y="33" class="font-display" fill="#1E1340" font-size="12" font-weight="600" text-anchor="middle" opacity="0.45">← Retour</text>

  <rect x="1335" y="12" width="85" height="32" rx="16" fill="url(#ctaPrimary)" filter="url(#btnShadow)"/>
  <text x="1378" y="33" class="font-display" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Sauver</text>

  <!-- HANDBALL COURT -->
  <g transform="translate(100, 80)" filter="url(#courtShadow)">
    <rect width="1280" height="700" rx="14" fill="url(#courtGrad)"/>

    <!-- Center line -->
    <line x1="640" y1="0" x2="640" y2="700" stroke="#ffffff" stroke-width="2" opacity="0.45"/>
    <!-- Center circle -->
    <circle cx="640" cy="350" r="60" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.45"/>
    <circle cx="640" cy="350" r="3" fill="#ffffff" opacity="0.4"/>

    <!-- LEFT GOAL AREA -->
    <rect x="-2" y="285" width="8" height="130" rx="2" fill="#ffffff" opacity="0.8"/>
    <path d="M 0 220 Q 160 350 0 480" fill="#C8850A" opacity="0.5"/>
    <path d="M 0 220 Q 160 350 0 480" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <path d="M 0 170 Q 220 350 0 530" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35" stroke-dasharray="8,6"/>

    <!-- RIGHT GOAL AREA -->
    <rect x="1274" y="285" width="8" height="130" rx="2" fill="#ffffff" opacity="0.8"/>
    <path d="M 1280 220 Q 1120 350 1280 480" fill="#C8850A" opacity="0.5"/>
    <path d="M 1280 220 Q 1120 350 1280 480" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <path d="M 1280 170 Q 1060 350 1280 530" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35" stroke-dasharray="8,6"/>

    <!-- RED TEAM -->
    <g transform="translate(380, 250)">
      <circle r="18" fill="#E8553D" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">4</text>
    </g>
    <g transform="translate(350, 350)">
      <circle r="18" fill="#E8553D" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">9</text>
    </g>
    <g transform="translate(380, 180)">
      <circle r="18" fill="#E8553D" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">3</text>
    </g>
    <g transform="translate(380, 450)">
      <circle r="18" fill="#E8553D" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">5</text>
    </g>
    <g transform="translate(280, 100)">
      <circle r="18" fill="#E8553D" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">7</text>
    </g>
    <g transform="translate(280, 580)">
      <circle r="18" fill="#E8553D" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">2</text>
    </g>

    <!-- YELLOW TEAM -->
    <g transform="translate(900, 250)">
      <circle r="18" fill="#F2B705" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#1E1340" font-size="12" font-weight="800" text-anchor="middle">1</text>
    </g>
    <g transform="translate(900, 450)">
      <circle r="18" fill="#F2B705" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#1E1340" font-size="12" font-weight="800" text-anchor="middle">3</text>
    </g>
    <g transform="translate(950, 350)">
      <circle r="18" fill="#F2B705" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#1E1340" font-size="12" font-weight="800" text-anchor="middle">2</text>
    </g>
    <g transform="translate(850, 160)">
      <circle r="18" fill="#F2B705" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#1E1340" font-size="12" font-weight="800" text-anchor="middle">4</text>
    </g>
    <g transform="translate(850, 540)">
      <circle r="18" fill="#F2B705" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#1E1340" font-size="12" font-weight="800" text-anchor="middle">5</text>
    </g>

    <!-- GOALKEEPERS -->
    <g transform="translate(80, 350)">
      <circle r="20" fill="#9C27B0" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">GB</text>
    </g>
    <g transform="translate(1200, 350)">
      <circle r="20" fill="#9C27B0" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5"/>
      <text y="6" class="font-display" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">GB</text>
    </g>

    <!-- BALLS -->
    <circle cx="420" cy="320" r="9" fill="#BCFF00" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="820" cy="200" r="7" fill="#BCFF00" opacity="0.5"/>

    <!-- CONES -->
    <polygon points="560,260 570,240 580,260" fill="#E8553D" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" opacity="0.8"/>
    <polygon points="560,440 570,420 580,440" fill="#E8553D" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" opacity="0.8"/>

    <!-- TRAJECTORIES -->
    <path d="M 420 320 C 480 280 520 270 560 260" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="10,5" fill="none" opacity="0.5"/>
    <polygon points="558,255 565,258 560,265" fill="#ffffff" opacity="0.5"/>

    <path d="M 350 350 C 400 320 450 300 490 290" stroke="#E8553D" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.4"/>
    <polygon points="488,285 495,288 490,295" fill="#E8553D" opacity="0.4"/>

    <path d="M 380 450 C 420 430 480 420 520 440" stroke="#F2B705" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.4"/>
    <polygon points="518,435 525,438 520,445" fill="#F2B705" opacity="0.4"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" width="390" height="780">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap');
      .urb { font-family: 'Urbanist', system-ui, sans-serif; }
      .it  { font-family: 'Inter', system-ui, sans-serif; }
    </style>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#FFF8F5"/>
    </linearGradient>
    <filter id="shadA"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#7C5CFC" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="390" height="780" fill="url(#bgA)"/>

  <!-- Toolbar -->
  <g>
    <rect x="0" y="0" width="390" height="64" fill="#FEFCFF"/>
    <line x1="0" y1="64" x2="390" y2="64" stroke="#7C5CFC" stroke-opacity="0.10"/>
    <rect x="14" y="16" width="32" height="32" rx="9" fill="#F5EEFF"/>
    <path d="M34 28 L26 28 M30 24 L26 28 L30 32" stroke="#7C5CFC" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <rect x="270" y="16" width="50" height="32" rx="11" fill="#FEFCFF" stroke="#7C5CFC" stroke-opacity="0.25"/>
    <text x="295" y="36" class="it" font-size="10" font-weight="700" fill="#7C5CFC" text-anchor="middle">Brouillon</text>
    <rect x="328" y="16" width="48" height="32" rx="11" fill="#7C5CFC" filter="url(#shadA)"/>
    <text x="352" y="36" font-size="13" text-anchor="middle">💾</text>
  </g>

  <!-- BULLE A : pill papier + barre de progression -->
  <g transform="translate(125, 78)" filter="url(#shadA)">
    <rect width="140" height="38" rx="19" fill="#FEFCFF" stroke="#7C5CFC" stroke-opacity="0.30"/>
    <circle cx="18" cy="16" r="3" fill="#7C5CFC"/>
    <circle cx="18" cy="16" r="6" fill="#7C5CFC" opacity="0.18"/>
    <text x="32" y="20" class="urb" font-size="12" font-weight="800" fill="#1E1340">3<tspan font-weight="500" fill="#1E1340" opacity="0.5"> / 8</tspan></text>
    <text x="74" y="20" class="it" font-size="10.5" fill="#1E1340" opacity="0.55">Surnombre…</text>
    <path d="M122 14 L126 18 L130 14" stroke="#7C5CFC" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <rect x="14" y="28" width="112" height="2" rx="1" fill="#7C5CFC" opacity="0.10"/>
    <rect x="14" y="28" width="42" height="2" rx="1" fill="#7C5CFC"/>
  </g>

  <!-- Contenu : carte entête -->
  <g transform="translate(16, 140)">
    <rect width="358" height="80" rx="14" fill="#FEFCFF" stroke="#7C5CFC" stroke-opacity="0.10"/>
    <text x="16" y="26" class="urb" font-size="11" font-weight="800" fill="#1E1340" opacity="0.45">ENTÊTE</text>
    <text x="16" y="48" class="urb" font-size="14" font-weight="800" fill="#1E1340">Améliorer le jeu du porteur de balle</text>
    <text x="16" y="66" class="it" font-size="10" fill="#1E1340" opacity="0.55">U15 · 12/03/26 · 1h30</text>
  </g>

  <!-- Carte situation 03 (active) -->
  <g transform="translate(16, 236)">
    <rect width="358" height="280" rx="16" fill="#FEFCFF" stroke="#7C5CFC" stroke-opacity="0.18" filter="url(#shadA)"/>
    <rect x="0" y="0" width="6" height="280" rx="3" fill="#7C5CFC"/>
    <text x="22" y="28" class="urb" font-size="11" font-weight="800" fill="#7C5CFC">SITUATION 03</text>
    <text x="22" y="50" class="urb" font-size="16" font-weight="800" fill="#1E1340">Surnombre 3v2</text>
    <rect x="22" y="66" width="60" height="20" rx="10" fill="#F5EEFF"/>
    <text x="52" y="80" class="it" font-size="10" font-weight="700" fill="#7C5CFC" text-anchor="middle">attaque</text>
    <rect x="88" y="66" width="64" height="20" rx="10" fill="#F5EEFF"/>
    <text x="120" y="80" class="it" font-size="10" font-weight="700" fill="#7C5CFC" text-anchor="middle">3 vs 2</text>
    <rect x="22" y="100" width="314" height="160" rx="10" fill="#1976D2" opacity="0.08"/>
    <text x="179" y="186" class="it" font-size="11" fill="#1976D2" text-anchor="middle" opacity="0.6">[ schéma ]</text>
  </g>

  <text x="20" y="760" class="it" font-size="10" fill="#1E1340" opacity="0.5">Variante A — capsule papier + progression</text>
</svg>

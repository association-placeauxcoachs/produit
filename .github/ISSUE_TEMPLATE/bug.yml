name: Bug
description: Signaler quelque chose qui ne fonctionne pas comme attendu
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce problème. **N'indiquez ni mot de passe ni adresse email** : ce dépôt est public.
        Une faille de sécurité se signale par email à support@placeauxcoachs.fr, pas ici.
  - type: textarea
    id: constat
    attributes:
      label: Ce qui s'est passé
      placeholder: "En cliquant sur « Télécharger le PDF », rien ne se passe."
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui était attendu
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Ouvrir un entraînement
        2. Cliquer sur…
  - type: input
    id: page
    attributes:
      label: Page concernée
      placeholder: "https://placeauxcoachs.fr/entrainements/…"
  - type: dropdown
    id: appareil
    attributes:
      label: Appareil
      options:
        - Ordinateur
        - Tablette
        - Téléphone
